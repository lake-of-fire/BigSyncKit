name: Rebase receipt and convergence qualification
on:
  push:
    branches: [verify/sync-fake-timelines-20260915]
    paths: [.github/workflows/sync-rebase-finish.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: BigSyncKit
          fetch-depth: 0
      - name: Commit and push exact source-only repair before qualification
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp .github/finish-receipt-authority.py "$RUNNER_TEMP/finish-receipt-authority.py"
          git checkout --detach 3896cca12c51ade0a2c659fbd1d0c4360f42b9d5
          python3 "$RUNNER_TEMP/finish-receipt-authority.py"
          test "$(git hash-object Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift)" = 9038e1475a48261ec4015adb287e90e401e98615
          git diff --check
          git diff > "$RUNNER_TEMP/evidence/receipt-fix.patch"
          git add Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift
          git config user.name 'Manabi contributors'
          git config user.email 'contributors@manabi.io'
          git commit -m 'Keep comparison receipt authority through every acknowledgement phase' -m 'Reject duplicate/type/zone/proof mismatches before state changes. Filter stale comparison receipts out of generation-only acknowledgement, recheck the admitted base at both remaining commits, and retain exact-receipt replay after target-only commit. Tests precede this change.'
          git push origin HEAD:refs/heads/fix/record-rebase-accounting-20260916
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$RUNNER_TEMP/evidence/identity.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Toolchain
        id: toolchain
        run: |
          swift --version > "$RUNNER_TEMP/evidence/toolchain.txt"
          sw_vers >> "$RUNNER_TEMP/evidence/toolchain.txt"
          echo "id=$(shasum -a 256 "$RUNNER_TEMP/evidence/toolchain.txt" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          brew install xcsift
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.rebase-build
          key: rebase-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('BigSyncKit/Package.resolved') }}-9038e147
          restore-keys: |
            rebase-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('BigSyncKit/Package.resolved') }}-
      - name: Qualify immutable committed receipt and rebase sources
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          git diff --exit-code
          swift test --scratch-path "$GITHUB_WORKSPACE/.rebase-build" --filter 'SyncRecordReceiptTests|SyncRecordRebaseTests|BigSyncLifetimeIDTests' 2>&1 | tee "$RUNNER_TEMP/evidence/focused.log" | xcsift
          swift test --scratch-path "$GITHUB_WORKSPACE/.rebase-build" 2>&1 | tee "$RUNNER_TEMP/evidence/full.log" | xcsift
      - name: Exact final identity
        if: always()
        working-directory: BigSyncKit
        run: |
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/final-identity.txt"
          git diff --exit-code > "$RUNNER_TEMP/evidence/source-clean.txt"
          cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebase-receipt-fixed-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
