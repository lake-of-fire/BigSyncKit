name: Account-change retain-cycle refinement qualification

on:
  push:
    branches: [automation/account-change-test-refinement-r4-20260917]

permissions:
  contents: read

concurrency:
  group: account-change-test-refinement-r4-20260917
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e69fdc63db0138f6b2ea497b0ac3908c42e11ff2
          path: BigSyncKit
      - name: Assemble checksum-verified retain-cycle cleanup
        run: python3 tooling/.github/assemble-account-change-tests-r4.py BigSyncKit
      - name: Publish clean cleanup onto PR branch
        id: publish
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e69fdc63db0138f6b2ea497b0ac3908c42e11ff2
          git diff --check
          test "$(git diff --name-only)" = Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c refine/account-change-validation-tests-r4-20260917
          git add Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift
          git commit -m 'test: break account-invalidation fixture retain cycle'
          git push origin HEAD:refs/heads/fix/account-change-validation-tests-20260917
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat --oneline HEAD

  native:
    needs: assemble
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.assemble.outputs.commit }}
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Record immutable source and toolchain
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          mkdir -p ../qualification-r2
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree} HEAD:Sources HEAD:Tests > ../qualification-r2/source-identity.txt
          git log -4 --format=fuller > ../qualification-r2/commits.txt
          swift --version > ../qualification-r2/toolchain.txt
          sw_vers >> ../qualification-r2/toolchain.txt
          xcrun --show-sdk-version >> ../qualification-r2/toolchain.txt
          git -C ../RealmSwiftGaps rev-parse HEAD > ../qualification-r2/RealmSwiftGaps.txt
          git -C ../SwiftUtilities rev-parse HEAD > ../qualification-r2/SwiftUtilities.txt
      - name: Focused, full, release, serial stress, and parallel stress
        working-directory: BigSyncKit
        run: python3 ../tooling/.github/qualify-account-change-tests-r2.py
      - name: Verify immutable candidate after qualification
        if: always()
        working-directory: BigSyncKit
        run: |
          git diff --exit-code
          git status --porcelain > ../qualification-r2/source-status.txt
          cmp ../qualification-r2/source-identity.txt ../qualification-r2/final-identity.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: account-change-tests-retain-cycle-native
          path: qualification-r2/
          retention-days: 14
