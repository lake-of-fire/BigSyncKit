name: Rebase boundary repair qualification
on:
  push:
    branches: [verify/rebase-integration-review-20260916]
    paths: [.github/workflows/rebase-boundary-finish.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d3b19727b34d7fa7032c1d56b8d0f408dd19137f
          path: BigSyncKit
          fetch-depth: 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Commit source-only repair before qualification
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift')
          text = path.read_text()
          old = '\n'.join([
              '        let incoming: Set<String>',
              '        if pending != nil {',
              '            guard let base else {'
          ])
          new = '\n'.join([
              '        // A local delete deliberately retires its field base. Preserve',
              '        // the existing generation-fenced deletion path instead of',
              '        // rejecting an inbound page because that base is now absent.',
              '        if pending != nil, (object as? SoftDeletable)?.isDeleted == true {',
              '            return false',
              '        }',
              '        let incoming: Set<String>',
              '        if pending != nil {',
              '            guard let base else {'
          ])
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '\n'.join([
              '                // Deletion is a whole-record lifecycle decision, not a field',
              '                // that can be combined with an unrelated edit to make a zombie.',
              '                incoming = preferRemote ? Set(remote.keys) : []'
          ])
          new = '\n'.join([
              '                // A value-bearing tombstone carries a lifetime; a CloudKit',
              '                // deleted-record ID does not. Honor that lifetime before',
              '                // unrelated metadata clocks, selecting the record together.',
              '                let deletionPrefersRemote: Bool',
              '                if lifetimeField != nil,',
              '                   lifetimeValue(object) != lifetimeValue(remoteObject),',
              '                   let ordered = try BigSyncLifetimeID.prefersIncoming(',
              '                       local: lifetimeValue(object), incoming: lifetimeValue(remoteObject)',
              '                   ) {',
              '                    deletionPrefersRemote = ordered',
              '                } else {',
              '                    deletionPrefersRemote = preferRemote',
              '                }',
              '                incoming = deletionPrefersRemote ? Set(remote.keys) : []'
          ])
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff > "$RUNNER_TEMP/evidence/production-repair.patch"
          git config user.name 'Manabi contributors'
          git config user.email 'contributors@manabi.io'
          git add Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift
          git commit -m 'Preserve pending deletion intent and order value-bearing tombstones by lifetime'
          git push origin HEAD:refs/heads/fix/record-rebase-accounting-20260916
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/source-identity.txt"
      - name: Toolchain
        id: toolchain
        run: |
          swift --version > "$RUNNER_TEMP/evidence/toolchain.txt"
          sw_vers >> "$RUNNER_TEMP/evidence/toolchain.txt"
          echo "id=$(shasum -a 256 "$RUNNER_TEMP/evidence/toolchain.txt" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          brew install xcsift
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: ${{ github.workspace }}/.rebase-build
          key: rebase-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('BigSyncKit/Package.resolved') }}-boundary-green-v3
          restore-keys: |
            rebase-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('BigSyncKit/Package.resolved') }}-
      - name: Focused and full native tests against committed unchanged source
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          git diff --exit-code
          swift test --scratch-path "$GITHUB_WORKSPACE/.rebase-build" --filter 'SyncRebaseIntegrationBoundaryTests|SyncRecordReceiptTests|SyncRecordReceiptValidationTests|SyncRecordRebaseTests|BigSyncLifetimeIDTests' 2>&1 | tee "$RUNNER_TEMP/evidence/focused.log" | xcsift
          swift test --scratch-path "$GITHUB_WORKSPACE/.rebase-build" 2>&1 | tee "$RUNNER_TEMP/evidence/full.log" | xcsift
          git diff --exit-code
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.rebase-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Preserve exact final evidence
        if: always()
        working-directory: BigSyncKit
        run: |
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/final-identity.txt"
          git diff --exit-code > "$RUNNER_TEMP/evidence/source-clean.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/evidence/qualified-source.tar.gz" HEAD
          cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebase-boundary-repair-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: error
