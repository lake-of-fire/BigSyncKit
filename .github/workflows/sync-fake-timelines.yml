name: Sync fake-provider qualification
on:
  push:
    branches: [verify/sync-fake-timelines-20260915]
    paths: [.github/workflows/sync-fake-timelines.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a76e44bd1e3bf4ba5dd9fa0af6da3aad24db14e6
          path: BigSyncKit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Toolchain and formatter
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          swift --version > "$RUNNER_TEMP/evidence/toolchain.txt"
          sw_vers >> "$RUNNER_TEMP/evidence/toolchain.txt"
          brew install xcsift
      - name: Prove local-conflict failure composition regressed before its repair
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          git checkout --detach 59d1f70d1d6a435ba7d6e713ff5a76f734cfb3c8
          set +e
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncConflictFailureCompositionTests 2>&1 | tee "$RUNNER_TEMP/evidence/red-local-conflict.log" | xcsift
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Executed 8 tests' "$RUNNER_TEMP/evidence/red-local-conflict.log"
          grep -q 'Local processing hid a sibling CloudKit constraint' "$RUNNER_TEMP/evidence/red-local-conflict.log"
      - name: Run compact fake-provider and known-issue repro suites once
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          git checkout --detach a76e44bd1e3bf4ba5dd9fa0af6da3aad24db14e6
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncLongLivedReplicaTests 2>&1 | tee "$RUNNER_TEMP/evidence/timelines.log" | xcsift
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncConflictFailureCompositionTests 2>&1 | tee "$RUNNER_TEMP/evidence/conflict-failures.log" | xcsift
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncStaleBaseReproductionTests 2>&1 | tee "$RUNNER_TEMP/evidence/stale-base-repro.log" | xcsift
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncSemanticIntentTests 2>&1 | tee "$RUNNER_TEMP/evidence/semantic.log" | xcsift
      - name: Full native library suite once
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          swift test --scratch-path "$RUNNER_TEMP/build" 2>&1 | tee "$RUNNER_TEMP/evidence/full.log" | xcsift
      - name: Record exact source
        if: always()
        working-directory: BigSyncKit
        run: |
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
          git diff --exit-code > "$RUNNER_TEMP/evidence/source-clean.txt"
          cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sync-fake-provider-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
