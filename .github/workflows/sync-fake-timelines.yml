name: Sync fake-provider timeline qualification
on:
  push:
    branches: [verify/sync-fake-timelines-20260915]
    paths: [.github/workflows/sync-fake-timelines.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b9923810c7f53b69550e686df90152998ec35d55
          path: BigSyncKit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Toolchain and formatter
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          swift --version > "$RUNNER_TEMP/evidence/toolchain.txt"
          sw_vers >> "$RUNNER_TEMP/evidence/toolchain.txt"
          brew install xcsift
      - name: Run new regressions at committed before-fix revision
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          git checkout --detach c7c13e295e63e8eeb32ad878f979804c0b4b7ce9
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/red-identity.txt"
          set +e
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncConflictFailureCompositionTests 2>&1 | tee "$RUNNER_TEMP/evidence/red.log" | xcsift
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Executed 8 tests' "$RUNNER_TEMP/evidence/red.log"
          grep -q 'Local processing hid a sibling CloudKit constraint' "$RUNNER_TEMP/evidence/red.log"
          git diff --exit-code
      - name: Run unchanged repaired revision with provider injection
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          git checkout --detach b9923810c7f53b69550e686df90152998ec35d55
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncConflictFailureCompositionTests 2>&1 | tee "$RUNNER_TEMP/evidence/green.log" | xcsift
          for repeat in 1 2 3; do
            swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncLongLivedReplicaTests 2>&1 | tee "$RUNNER_TEMP/evidence/timelines-$repeat.log" | xcsift
          done
      - name: Full native library suite
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          swift test --scratch-path "$RUNNER_TEMP/build" 2>&1 | tee "$RUNNER_TEMP/evidence/full.log" | xcsift
      - name: Record exact source
        if: always()
        working-directory: BigSyncKit
        run: |
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
          git diff --exit-code > "$RUNNER_TEMP/evidence/source-clean.txt"
          cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sync-fake-timelines-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
