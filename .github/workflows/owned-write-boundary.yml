name: Owned Realm write source boundary
on:
  pull_request:
    paths:
      - 'Sources/**'
      - '.github/check-owned-writes.swift'
      - '.github/check-owned-writes.sh'
      - '.github/workflows/owned-write-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check production syntax and guard self-tests without resolving packages
        run: .github/check-owned-writes.sh
