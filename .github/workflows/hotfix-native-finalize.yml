name: Finalize native hotfix regressions
on:
  push:
    branches: [fix/hotfix-sync-native-fixture-20260912]
    paths: [.github/workflows/hotfix-native-finalize.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e39111513fce377f3d4e55cc1e082e8dfcb6f7ae
          path: BigSyncKit
          fetch-depth: 0
      - name: Remove unsupported missing-journal premise
        working-directory: BigSyncKit
        run: |
          test "$(git rev-parse HEAD)" = e39111513fce377f3d4e55cc1e082e8dfcb6f7ae
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift')
          s = p.read_text()
          old = '                    guard realm.schema.objectSchema.contains(where: {\n                        $0.className == BigSyncPendingMutation.className()\n                    }) else { continue }\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, ''))
          p = Path('Tests/BigSyncKitTests/BigSyncKitTests.swift')
          s = p.read_text()
          start = s.index('    @BigSyncBackgroundActor\n    func testReevaluationColdInspectionAcceptsTargetWithoutMutationJournalType')
          end = s.index('    @BigSyncBackgroundActor\n    private func makeSynchronizer', start)
          p.write_text(s[:start] + s[end:])
          PY
          git diff --check
          git add Sources Tests
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: retain the mandatory mutation journal configuration contract'
          git push origin HEAD:refs/heads/fix/hotfix-sync-deeper-20260912
          git rev-parse HEAD > qualification-commit.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Record inputs
        working-directory: BigSyncKit
        run: |
          xcodebuild -version > qualification-toolchain.txt
          swift --version >> qualification-toolchain.txt
          git -C ../RealmSwiftGaps rev-parse HEAD > qualification-RealmSwiftGaps.txt
          git -C ../SwiftUtilities rev-parse HEAD > qualification-SwiftUtilities.txt
      - name: Execute committed qualification recipe
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s = Path('.github/workflows/hotfix-reevaluation.yml').read_text()
          start = s.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = s.index('\n          PY', start)
          lines = s[start:end].splitlines()
          assert all(line.startswith('          ') for line in lines)
          Path('/tmp/hotfix-final-qualification.py').write_text('\n'.join(line[10:] for line in lines) + '\n')
          subprocess.run(['python3', '/tmp/hotfix-final-qualification.py'], check=True)
          PY
      - name: Archive exact committed source
        if: always()
        working-directory: BigSyncKit
        run: git archive --format=tar.gz -o qualification-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-native-qualification
          path: BigSyncKit/qualification-*
          retention-days: 14
