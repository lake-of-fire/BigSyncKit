name: RA-1 W3 package harness probe 3
on:
  push:
    branches: [codex/ra1-final-w3-package-probe3-20260913]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/BigSyncKit
          ref: b1cde24b2e22e68a5cd056b865bc53f7fd491e2a
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Apply narrowed repair
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ra1-w3-probe3"
          python3 - <<'PY'
          from pathlib import Path

          source = Path('Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift')
          text = source.read_text()
          old = (
              "            durableStateNamespace = Self.makeDurableStateNamespace(\n"
              "                identifier: identifier,\n"
              "                containerIdentifier: containerIdentifier,\n"
              "                databaseScope: database.databaseScope,\n"
              "                recordZoneID: adapter.recordZoneID\n"
              "            )\n"
          )
          new = old + (
              "            do {\n"
              "                _ = try BackupDetection.run(\n"
              "                    store: keyValueStore,\n"
              "                    namespace: durableStateNamespace,\n"
              "                    sharedSentinelBaseURL: backupDetectionBaseURL\n"
              "                )\n"
              "                backupDetectionError = nil\n"
              "            } catch {\n"
              "                accountScopeAuthorityFence.poison()\n"
              "                backupDetectionError = error\n"
              "                logger.error(\"QSCloudKitSynchronizer >> Backup detection failed after test-only zone rebind: \\(error)\")\n"
              "            }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one DEBUG rebind namespace assignment, found {text.count(old)}')
          source.write_text(text.replace(old, new))

          test = Path('Tests/BigSyncKitTests/OwnedRecordRevisionTests.swift')
          text = test.read_text()
          old = (
              "        f.adapter._testBeforeImportedRecordPersistenceWrite = { await f.refresh() }\n"
              "        defer { f.adapter._testBeforeImportedRecordPersistenceWrite = nil }\n"
              "        try await sync.synchronizeAdapter(f.adapter)\n"
          )
          new = (
              "        f.adapter._testBeforeImportedRecordPersistenceWrite = { await f.refresh() }\n"
              "        defer { f.adapter._testBeforeImportedRecordPersistenceWrite = nil }\n"
              "        // This helper drives the lower-level upload loop directly. Detach\n"
              "        // the ordinary wake delegate so a replacement generation cannot\n"
              "        // start an unrelated full change-feed drain through this scripted IO.\n"
              "        f.adapter.modelAdapterDelegate = nil\n"
              "        try await sync.synchronizeAdapter(f.adapter)\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one conflict-loop call site, found {text.count(old)}')
          test.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift Tests/BigSyncKitTests/OwnedRecordRevisionTests.swift | tee "$RUNNER_TEMP/ra1-w3-probe3/source.patch"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/ra1-w3-probe3/identity.txt"
          swift --version | tee "$RUNNER_TEMP/ra1-w3-probe3/toolchain.txt"
      - name: Owned revision
        continue-on-error: true
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          swift test --filter 'OwnedRecordRevisionTests' 2>&1 | tee "$RUNNER_TEMP/ra1-w3-probe3/owned.log"
      - name: Legacy BigSyncKitTests
        if: always()
        continue-on-error: true
        working-directory: BigSyncKit
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        run: |
          set -o pipefail
          swift test --filter 'BigSyncKitTests.BigSyncKitTests' 2>&1 | tee "$RUNNER_TEMP/ra1-w3-probe3/legacy.log"
      - name: Replay regression
        if: always()
        continue-on-error: true
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          swift test --filter 'RA1InboundReplayTests' 2>&1 | tee "$RUNNER_TEMP/ra1-w3-probe3/replay.log"
      - name: Full package
        if: always()
        continue-on-error: true
        working-directory: BigSyncKit
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/ra1-w3-probe3/full.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra1-final-w3-package-probe3
          path: ${{ runner.temp }}/ra1-w3-probe3/
          retention-days: 7
          if-no-files-found: error
