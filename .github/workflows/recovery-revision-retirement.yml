name: Recovery revision and retirement red-green
on:
  push:
    branches: [verify/recovery-revision-retirement-20260917]
    paths: [.github/workflows/recovery-revision-retirement.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: BigSyncKit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: qualification
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e4ad9384e958af6ab224ae29619a9f2a54f3a3c2
          fetch-depth: 0
          path: BigSyncKit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 02faace3e1c821bf4d4c3f3e3d7770b5d4acea21
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Import immutable tests and repair without workflow ancestry
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/mail"
          git config user.name 'Retained sync review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git mailsplit -o"$RUNNER_TEMP/mail" "$GITHUB_WORKSPACE/qualification/.github/recovery-review.mbox"
          GIT_COMMITTER_DATE='2026-09-17T12:50:54+0000' git am "$RUNNER_TEMP/mail/0001"
          test "$(git rev-parse HEAD)" = 77ba270dd7faf4490917a849fd8b71f1fc397815
          test "$(git rev-parse HEAD^{tree})" = a392a1db68b8fbbdc1602f3acbaf9790aa1beb9c
          git diff --exit-code HEAD^ HEAD -- Sources
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/red-source.txt"
          GIT_COMMITTER_DATE='2026-09-17T12:50:55+0000' git am "$RUNNER_TEMP/mail/0002"
          test "$(git rev-parse HEAD)" = ead22da47341507d58b8d2eb2d43dcf94f165ec9
          test "$(git rev-parse HEAD^{tree})" = 0dd14269ced8c78a6ba708efa0d0b0175c2c6879
          git branch qualified-source HEAD
          git checkout --detach 77ba270dd7faf4490917a849fd8b71f1fc397815
          test -z "$(git status --porcelain --untracked-files=all)"
          git -C ../RealmSwiftGaps rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/RealmSwiftGaps.txt"
          git -C ../SwiftUtilities rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/SwiftUtilities.txt"
      - name: Record toolchain
        id: toolchain
        run: |
          set -euo pipefail
          command -v xcsift >/dev/null || brew install xcsift
          swift --version > "$RUNNER_TEMP/evidence/toolchain.txt"
          sw_vers >> "$RUNNER_TEMP/evidence/toolchain.txt"
          uname -m >> "$RUNNER_TEMP/evidence/toolchain.txt"
          echo "id=$(shasum -a 256 "$RUNNER_TEMP/evidence/toolchain.txt" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os, re, subprocess
          text = subprocess.check_output(['swift', '--version'], text=True)
          match = re.search(r'Swift version (\d+)\.(\d+)', text)
          assert match, text
          modern = tuple(map(int, match.groups())) >= (6, 3)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('REVIEW_DISABLE_PREBUILTS=' + ('1' if modern else '0') + '\n')
              scratch = '/.review-clean-' + os.environ['GITHUB_RUN_ID'] if modern else '/.rebase-build'
              out.write('REVIEW_SCRATCH=' + os.environ['GITHUB_WORKSPACE'] + scratch + '\n')
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/.rebase-build
          key: rebase-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('BigSyncKit/Package.swift', 'BigSyncKit/Package.resolved') }}-recovery-review-${{ github.run_id }}
          restore-keys: |
            rebase-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('BigSyncKit/Package.swift', 'BigSyncKit/Package.resolved') }}-
            rebase-${{ runner.os }}-${{ runner.arch }}-
      - name: Require behavioral red, not compilation failure
        run: |
          set -euo pipefail
          flags=(--scratch-path "$REVIEW_SCRATCH")
          if [[ "$REVIEW_DISABLE_PREBUILTS" == 1 ]]; then flags+=(--disable-experimental-prebuilts); fi
          set +e
          swift test "${flags[@]}" --filter 'testConflictRefreshTracksAcceptedRevisionAfterLateUploadAcknowledgement|testArchivePruningCannotConsumeResolutionOutsideItsRetiredSnapshot' 2>&1 | tee "$RUNNER_TEMP/evidence/red.log" | xcsift
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -ne 0
          test "${statuses[1]}" -eq 0
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'evidence/red.log').read_text()
          for name in ['testConflictRefreshTracksAcceptedRevisionAfterLateUploadAcknowledgement', 'testArchivePruningCannotConsumeResolutionOutsideItsRetiredSnapshot']:
              assert re.search(r"Test Case '[^'\n]*" + name + r"[^'\n]*' failed", text), name
          assert re.search(r"Test Suite 'Selected tests' failed at [^\n]+\n\s*Executed 2 tests, with [1-9]\d* failures \(0 unexpected\)", text), 'No completed two-test assertion failure'
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Qualify repaired exact product
        run: |
          set -euo pipefail
          git checkout --detach ead22da47341507d58b8d2eb2d43dcf94f165ec9
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/source-identity.txt"
          flags=(--scratch-path "$REVIEW_SCRATCH")
          if [[ "$REVIEW_DISABLE_PREBUILTS" == 1 ]]; then flags+=(--disable-experimental-prebuilts); fi
          swift test "${flags[@]}" --filter 'BigSyncLifetimeIDTests|BigSyncLifetimeSuccessorTests|SyncRebaseIntegrationBoundaryTests|SyncRecordRebaseTests|SyncRecordReceiptTests|SyncRecordReceiptValidationTests|SyncRetainedRecordContractTests|HotfixMutationDrainTailTests' 2>&1 | tee "$RUNNER_TEMP/evidence/focused.log" | xcsift
          swift test "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/evidence/full.log" | xcsift
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/final-identity.txt"
          cmp "$RUNNER_TEMP/evidence/source-identity.txt" "$RUNNER_TEMP/evidence/final-identity.txt"
      - name: Verify nested suite completion and actual regression execution
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'evidence'
          required = {'BigSyncLifetimeIDTests': 9, 'BigSyncLifetimeSuccessorTests': 7, 'SyncRebaseIntegrationBoundaryTests': 11, 'SyncRecordRebaseTests': 25, 'SyncRecordReceiptTests': 6, 'SyncRecordReceiptValidationTests': 6, 'SyncRetainedRecordContractTests': 34, 'HotfixMutationDrainTailTests': 4}
          result = {}
          for mode, aggregate in [('focused', 'Selected tests'), ('full', 'All tests')]:
              text = (root / (mode + '.log')).read_text()
              assert not re.search(r"Test (?:Case|Suite) '[^'\n]+' failed", text)
              matches = re.findall(r"^Test Suite '([^'\n]+)' passed at [^\n]+\n\s*Executed (\d+) tests?, with (?:(\d+) tests? skipped and )?(\d+) failures? \((\d+) unexpected\) in ([\d.]+)", text, re.M)
              rows = {name: dict(executed=int(n), skipped=int(s or 0), failures=int(f), unexpected=int(u), seconds=float(t)) for name,n,s,f,u,t in matches}
              assert len(rows) == len(matches)
              stack, children, roots = [], {}, []
              for name, status in re.findall(r"^Test Suite '([^'\n]+)' (started|passed|failed) at .+$", text, re.M):
                  if status == 'started':
                      assert name not in children
                      children[name] = []
                      (children[stack[-1]] if stack else roots).append(name)
                      stack.append(name)
                  else:
                      assert status == 'passed' and stack and stack.pop() == name and name in rows
              assert not stack and roots == [aggregate] and set(children) == set(rows)
              for parent, names in children.items():
                  if names:
                      for key in ['executed', 'skipped', 'failures', 'unexpected']:
                          assert rows[parent][key] == sum(rows[n][key] for n in names), (mode,parent,key)
              for name, row in rows.items():
                  assert row['failures'] == row['unexpected'] == 0 and row['skipped'] <= row['executed']
              for name, count in required.items():
                  assert rows[name]['executed'] >= count and rows[name]['skipped'] == 0
              for name in ['testConflictRefreshTracksAcceptedRevisionAfterLateUploadAcknowledgement', 'testArchivePruningCannotConsumeResolutionOutsideItsRetiredSnapshot', 'testRevokedResolutionAuthorityCannotCommitEitherChoice', 'testRevokedRefreshAuthorityCannotRetireOrReplaceEvidence', 'testRevokedPruneAuthorityCannotDeleteRetainedArchives']:
                  assert re.search(r"Test Case '[^'\n]*" + name + r"[^'\n]*' passed", text), (mode,name)
              result[mode] = rows
          (root / 'verified-results.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps({mode: rows['All tests' if mode == 'full' else 'Selected tests'] for mode,rows in result.items()}, indent=2))
          PY
      - name: Publish tested candidate only
        run: |
          set -euo pipefail
          candidate=integration/recovery-review-qualified-20260917
          test -z "$(git ls-remote --heads origin "refs/heads/$candidate")"
          git push origin "HEAD:refs/heads/$candidate"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/published-candidate.txt"
      - name: Retain source and evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/final-identity.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/evidence/source-status.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/evidence/source.tar.gz" HEAD
          git bundle create "$RUNNER_TEMP/evidence/source.bundle" HEAD qualified-source
          cd "$RUNNER_TEMP/evidence"
          shasum -a 256 * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-revision-retirement-red-green
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: error
