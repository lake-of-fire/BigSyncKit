name: RA1 isolated source snapshot
on:
  push:
    branches: [codex/ra1-completion-20260912]
    paths: [.github/workflows/ra1-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive exact tracked source without executing application code
        shell: bash
        run: |
          git archive --format=tar.gz -o ra1-source.tar.gz HEAD
          git rev-parse HEAD > ra1-source-commit.txt
          git ls-tree -r HEAD > ra1-source-index.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ra1-source-snapshot
          path: ra1-source*
          retention-days: 3
          if-no-files-found: error
