name: RA1 debug rebind baseline probe

on:
  push:
    branches: [codex/ra1-final-bigsync-rebind-runner-20260912]

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: BigSyncKit
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/RealmSwiftGaps
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/SwiftUtilities
          path: SwiftUtilities
          persist-credentials: false
      - name: Select Xcode and capture input identity
        working-directory: BigSyncKit
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then sudo xcode-select -s /Applications/Xcode_26.3.app; fi
          mkdir -p "$RUNNER_TEMP/ra1-rebind"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ra1-rebind/input-identity.txt"
          git -C ../RealmSwiftGaps rev-parse HEAD > "$RUNNER_TEMP/ra1-rebind/realm-swift-gaps.txt"
          git -C ../SwiftUtilities rev-parse HEAD > "$RUNNER_TEMP/ra1-rebind/swift-utilities.txt"
          swift --version > "$RUNNER_TEMP/ra1-rebind/toolchain.txt"
          xcodebuild -version >> "$RUNNER_TEMP/ra1-rebind/toolchain.txt"
      - name: Apply bounded DEBUG rebind authority repair
        working-directory: BigSyncKit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift')
          s = p.read_text()
          marker = 'DEBUG zone rebind must initialize the rebound durable namespace'
          if marker in s:
              print('repair already present')
              raise SystemExit(0)
          old = '''#if DEBUG
        if allowsRecordZoneRebindingForTesting,
           modelAdapterDictionary.isEmpty,
           adapter.recordZoneID != recordZoneID {
            recordZoneID = adapter.recordZoneID
            durableStateNamespace = Self.makeDurableStateNamespace(
                identifier: identifier,
                containerIdentifier: containerIdentifier,
                databaseScope: database.databaseScope,
                recordZoneID: adapter.recordZoneID
            )
        }
        allowsRecordZoneRebindingForTesting = false
#endif'''
          new = '''#if DEBUG
        if allowsRecordZoneRebindingForTesting,
           modelAdapterDictionary.isEmpty,
           adapter.recordZoneID != recordZoneID {
            recordZoneID = adapter.recordZoneID
            durableStateNamespace = Self.makeDurableStateNamespace(
                identifier: identifier,
                containerIdentifier: containerIdentifier,
                databaseScope: database.databaseScope,
                recordZoneID: adapter.recordZoneID
            )
            // DEBUG zone rebind must initialize the rebound durable namespace.
            // Construction already created BackupDetection identity for the
            // original zone; changing the namespace without recreating that
            // identity makes ordinary outbound admission fail staleAuthority.
            // Production clients cannot enter this compatibility seam.
            do {
                let result = try BackupDetection.run(
                    store: keyValueStore,
                    namespace: durableStateNamespace,
                    sharedSentinelBaseURL: backupDetectionBaseURL
                )
                backupDetectionError = nil
                refreshBackupRestoreRequirement()
                if result == .restoredFromBackup || backupRestoreDetected {
                    accountScopeAuthorityFence.poison()
                    clearDeviceIdentifier()
                    try invalidateAccountScopeLeaseDurably()
                    queueAccountScopeInvalidation(.restoreDetected)
                }
            } catch {
                accountScopeAuthorityFence.poison()
                backupDetectionError = error
                logger.error(
                    "QSCloudKitSynchronizer >> DEBUG record-zone rebind backup detection failed: \\(error)"
                )
            }
        }
        allowsRecordZoneRebindingForTesting = false
#endif'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one rebind block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git diff -- Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift | tee "$RUNNER_TEMP/ra1-rebind/source.patch"
      - name: Focused baseline failures
        working-directory: BigSyncKit
        shell: bash
        run: |
          set +e
          : > "$RUNNER_TEMP/ra1-rebind/focused.log"
          for filter in \
            testAccountSwitchDuringUploadPreparationSkipsCloudKitMutation \
            testChangeFeedBootstrapTreatsNeverCreatedZoneAsEmptyAndUploadsJournal \
            testRepeatedServerConflictStopsAfterBoundedRetries \
            testPreparedMutationBatchRejectsDuplicateNamesAndForeignZonesBeforeSending \
            testRealUploadLoopReplacesStalePendingMarkWithNewerServerEmptyState
          do
            echo "===== $filter =====" | tee -a "$RUNNER_TEMP/ra1-rebind/focused.log"
            swift test --filter "$filter" 2>&1 | tee -a "$RUNNER_TEMP/ra1-rebind/focused.log"
            echo "status=${PIPESTATUS[0]}" | tee -a "$RUNNER_TEMP/ra1-rebind/focused.log"
          done
          exit 0
      - name: Full package baseline closure run
        working-directory: BigSyncKit
        shell: bash
        run: |
          set +e
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/ra1-rebind/full.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/ra1-rebind/full-status.txt"
          grep -E "Test Suite '.*' (passed|failed)|Executed [0-9]+ tests" "$RUNNER_TEMP/ra1-rebind/full.log" > "$RUNNER_TEMP/ra1-rebind/summary.txt" || true
          grep -E "error: -\[|failed: caught error:" "$RUNNER_TEMP/ra1-rebind/full.log" > "$RUNNER_TEMP/ra1-rebind/failures.txt" || true
          exit 0
      - name: Commit patched source on probe branch
        working-directory: BigSyncKit
        shell: bash
        run: |
          if git diff --quiet -- Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift; then
            echo 'source already committed'
            exit 0
          fi
          git config user.name 'RA1 Qualification Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift
          git commit -m 'Repair DEBUG record-zone rebind authority identity'
          git push origin HEAD:codex/ra1-final-bigsync-rebind-runner-20260912
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra1-debug-rebind-baseline-probe
          path: ${{ runner.temp }}/ra1-rebind/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve full-suite status
        if: always()
        shell: bash
        run: |
          status_file="$RUNNER_TEMP/ra1-rebind/full-status.txt"
          if [ -f "$status_file" ]; then exit "$(cat "$status_file")"; fi
          exit 1
