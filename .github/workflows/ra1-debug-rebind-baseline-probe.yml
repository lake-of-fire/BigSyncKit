name: RA1 debug rebind baseline probe
on:
  push:
    branches:
      - codex/ra1-final-bigsync-rebind-runner-20260912
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: BigSyncKit
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/RealmSwiftGaps
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/SwiftUtilities
          path: SwiftUtilities
          persist-credentials: false
      - name: Select Xcode
        working-directory: BigSyncKit
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then sudo xcode-select -s /Applications/Xcode_26.3.app; fi
          swift --version
      - name: Apply repair and run package
        working-directory: BigSyncKit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p = Path('Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift')
          s = p.read_text()
          marker = 'DEBUG zone rebind must initialize the rebound durable namespace'
          if marker not in s:
              old = textwrap.dedent('''\
              #if DEBUG
                      if allowsRecordZoneRebindingForTesting,
                         modelAdapterDictionary.isEmpty,
                         adapter.recordZoneID != recordZoneID {
                          recordZoneID = adapter.recordZoneID
                          durableStateNamespace = Self.makeDurableStateNamespace(
                              identifier: identifier,
                              containerIdentifier: containerIdentifier,
                              databaseScope: database.databaseScope,
                              recordZoneID: adapter.recordZoneID
                          )
                      }
                      allowsRecordZoneRebindingForTesting = false
              #endif''')
              new = textwrap.dedent('''\
              #if DEBUG
                      if allowsRecordZoneRebindingForTesting,
                         modelAdapterDictionary.isEmpty,
                         adapter.recordZoneID != recordZoneID {
                          recordZoneID = adapter.recordZoneID
                          durableStateNamespace = Self.makeDurableStateNamespace(
                              identifier: identifier,
                              containerIdentifier: containerIdentifier,
                              databaseScope: database.databaseScope,
                              recordZoneID: adapter.recordZoneID
                          )
                          // DEBUG zone rebind must initialize the rebound durable namespace.
                          do {
                              let result = try BackupDetection.run(
                                  store: keyValueStore,
                                  namespace: durableStateNamespace,
                                  sharedSentinelBaseURL: backupDetectionBaseURL
                              )
                              backupDetectionError = nil
                              refreshBackupRestoreRequirement()
                              if result == .restoredFromBackup || backupRestoreDetected {
                                  accountScopeAuthorityFence.poison()
                                  clearDeviceIdentifier()
                                  try invalidateAccountScopeLeaseDurably()
                                  queueAccountScopeInvalidation(.restoreDetected)
                              }
                          } catch {
                              accountScopeAuthorityFence.poison()
                              backupDetectionError = error
                              logger.error(
                                  "QSCloudKitSynchronizer >> DEBUG rebind backup detection failed: \\(error)"
                              )
                          }
                      }
                      allowsRecordZoneRebindingForTesting = false
              #endif''')
              if s.count(old) != 1:
                  raise SystemExit(f'expected one DEBUG rebind block, found {s.count(old)}')
              p.write_text(s.replace(old, new))
          PY
          set +e
          swift test --filter testAccountSwitchDuringUploadPreparationSkipsCloudKitMutation
          swift test --filter testChangeFeedBootstrapTreatsNeverCreatedZoneAsEmptyAndUploadsJournal
          swift test --filter testRepeatedServerConflictStopsAfterBoundedRetries
          swift test --filter testRealUploadLoopReplacesStalePendingMarkWithNewerServerEmptyState
          set -o pipefail
          swift test 2>&1 | tee /tmp/ra1-full.log
          full_status=${PIPESTATUS[0]}
          grep -E "Test Suite '.*' (passed|failed)|Executed [0-9]+ tests" /tmp/ra1-full.log || true
          git diff -- Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift
          git config user.name 'RA1 Qualification Probe'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --quiet -- Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift; then
            git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift
            git commit -m 'Repair DEBUG record-zone rebind authority identity'
            git push origin HEAD:codex/ra1-final-bigsync-rebind-runner-20260912
          fi
          exit "$full_status"
