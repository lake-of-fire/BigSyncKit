name: RA-1 clean inbound replay qualification

on:
  push:
    branches:
      - codex/ra1-bigsync-inbound-replay-20260912

permissions:
  contents: write

concurrency:
  group: ra1-clean-inbound-replay
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualify-and-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/BigSyncKit
          ref: 84571b4c2a5262dfa52b66772d0276485d150f20
          path: BigSyncKit
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Apply bounded replay correction
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+Sync.swift')
          text = p.read_text()
          old = '''        if let migrationError = error as? ChangeFeedMigrationError,\n           migrationError.deletionKind == .encryptedDataReset {'''
          new = '''        if error is RealmSwiftInboundTargetChangedError {\n            // A non-journaled local write invalidated an inbound selection.\n            // The inbound page/cursor was not committed, so replay through an\n            // ordinary delayed synchronization rather than terminating the drain.\n            shouldRetry = true\n            retryDelay = 1\n        } else if let migrationError = error as? ChangeFeedMigrationError,\n           migrationError.deletionKind == .encryptedDataReset {'''
          assert text.count(old) == 1
          assert 'error is RealmSwiftInboundTargetChangedError' not in text
          p.write_text(text.replace(old, new, 1))
          test = Path('Tests/BigSyncKitTests/RA1InboundReplayTests.swift')
          assert not test.exists()
          test.write_text(r'''import CloudKit
          import Foundation
          import Logging
          import XCTest
          @testable import BigSyncKit

          private enum ReplayProbeError: Error { case unexpectedTransport, terminal }

          // Deliberately has no CKContainer or network-backed implementation.
          private final class ReplayProbeTransport: NSObject,
              CloudKitDatabaseAdapter, CloudKitChangeFeed,
              CloudKitSubscriptionStore, CloudKitZoneStore, CloudKitRecordStore,
              @unchecked Sendable {
              var databaseScope: CKDatabase.Scope { .private }
              func subscription(withID identifier: CKSubscription.ID) async throws -> CKSubscription? {
                  throw ReplayProbeError.unexpectedTransport
              }
              func save(subscription: CKSubscription) async throws -> CKSubscription {
                  throw ReplayProbeError.unexpectedTransport
              }
              func deleteSubscription(withID identifier: CKSubscription.ID) async throws {
                  throw ReplayProbeError.unexpectedTransport
              }
              func recordZone(withID identifier: CKRecordZone.ID) async throws -> CKRecordZone {
                  throw ReplayProbeError.unexpectedTransport
              }
              func save(recordZone: CKRecordZone) async throws -> CKRecordZone {
                  throw ReplayProbeError.unexpectedTransport
              }
              func deleteRecordZone(withID identifier: CKRecordZone.ID) async throws {
                  throw ReplayProbeError.unexpectedTransport
              }
              func modifyRecords(
                  saving recordsToSave: [CKRecord],
                  deleting recordIDsToDelete: [CKRecord.ID],
                  savePolicy: CKModifyRecordsOperation.RecordSavePolicy,
                  atomically: Bool
              ) async throws -> CloudKitRecordMutationResults {
                  throw ReplayProbeError.unexpectedTransport
              }
              func databaseChanges(
                  since cursor: DatabaseChangeCursor?, resultsLimit: Int?
              ) async throws -> CloudKitDatabaseChangePage {
                  throw ReplayProbeError.unexpectedTransport
              }
              func recordZoneChanges(
                  in zoneID: CKRecordZone.ID, since cursor: RecordZoneChangeCursor?,
                  desiredKeys: [CKRecord.FieldKey]?, resultsLimit: Int?
              ) async throws -> CloudKitRecordZoneChangePage {
                  throw ReplayProbeError.unexpectedTransport
              }
          }

          private final class ReplayProbeStore: NSObject, KeyValueStore {
              private var values = [String: Any]()
              func object(forKey key: String) -> Any? { values[key] }
              func bool(forKey key: String) -> Bool { values[key] as? Bool ?? false }
              func set(value: Any?, forKey key: String) { values[key] = value }
              func set(boolValue: Bool, forKey key: String) { values[key] = boolValue }
              func removeObject(forKey key: String) { values.removeValue(forKey: key) }
              func synchronize() -> Bool { true }
          }

          final class RA1InboundReplayTests: XCTestCase {
              @BigSyncBackgroundActor
              private func makeSynchronizer() -> (CloudKitSynchronizer, URL) {
                  let directory = FileManager.default.temporaryDirectory
                      .appendingPathComponent("RA1InboundReplay-\(UUID().uuidString)", isDirectory: true)
                  let synchronizer = CloudKitSynchronizer(
                      identifier: UUID().uuidString,
                      containerIdentifier: "iCloud.RA1InboundReplay.offline",
                      database: ReplayProbeTransport(),
                      recordZoneID: CKRecordZone.ID(zoneName: "RA1InboundReplay", ownerName: CKCurrentUserDefaultName),
                      keyValueStore: ReplayProbeStore(),
                      accountIdentifierProvider: { throw ReplayProbeError.unexpectedTransport },
                      accountStatusProvider: { throw ReplayProbeError.unexpectedTransport },
                      backupDetectionBaseURL: directory,
                      logger: Logger(label: "RA1InboundReplayTests")
                  )
                  return (synchronizer, directory)
              }

              @BigSyncBackgroundActor
              func testInboundTargetRaceSchedulesBoundedOrdinaryReplay() async throws {
                  let (synchronizer, directory) = makeSynchronizer()
                  defer {
                      synchronizer.cancelSynchronization()
                      try? FileManager.default.removeItem(at: directory)
                  }
                  synchronizer.syncing = true
                  synchronizer.synchronizationDrainIsActive = true
                  let attemptID = synchronizer.synchronizationAttemptID
                  let started = Date()
                  await synchronizer.failSynchronization(error:
                      RealmSwiftInboundTargetChangedError(recordName: "RA1ParityRecord.collision"))
                  let completed = Date()

                  XCTAssertEqual(synchronizer.synchronizationAttemptID, attemptID)
                  XCTAssertTrue(synchronizer.syncing)
                  XCTAssertTrue(synchronizer.synchronizationDrainIsActive)
                  XCTAssertNotNil(synchronizer.synchronizationTask)
                  let retryAt = try XCTUnwrap(synchronizer.retrySleepUntil)
                  XCTAssertGreaterThanOrEqual(retryAt, started.addingTimeInterval(1))
                  XCTAssertLessThanOrEqual(retryAt, completed.addingTimeInterval(1))
                  XCTAssertEqual(synchronizer.consecutiveTransientCloudKitFailures, 0)
                  await synchronizer.cancelSynchronizationAndWait()
              }

              @BigSyncBackgroundActor
              func testCancellationRevokesScheduledInboundReplay() async throws {
                  let (synchronizer, directory) = makeSynchronizer()
                  defer { try? FileManager.default.removeItem(at: directory) }
                  synchronizer.syncing = true
                  synchronizer.synchronizationDrainIsActive = true
                  await synchronizer.failSynchronization(error:
                      RealmSwiftInboundTargetChangedError(recordName: "RA1ParityRecord.collision"))
                  XCTAssertNotNil(synchronizer.retrySleepUntil)
                  await synchronizer.cancelSynchronizationAndWait()
                  let cancelledAttempt = synchronizer.synchronizationAttemptID
                  try await Task.sleep(nanoseconds: 1_100_000_000)
                  XCTAssertEqual(synchronizer.synchronizationAttemptID, cancelledAttempt)
                  XCTAssertFalse(synchronizer.syncing)
                  XCTAssertFalse(synchronizer.synchronizationDrainIsActive)
                  XCTAssertNil(synchronizer.retrySleepUntil)
                  XCTAssertNil(synchronizer.synchronizationTask)
              }

              @BigSyncBackgroundActor
              func testAlreadyCancelledRaceDoesNotScheduleReplay() async throws {
                  let (synchronizer, directory) = makeSynchronizer()
                  defer { try? FileManager.default.removeItem(at: directory) }
                  synchronizer.syncing = true
                  synchronizer.synchronizationDrainIsActive = true
                  synchronizer.cancelSync = true
                  await synchronizer.failSynchronization(error:
                      RealmSwiftInboundTargetChangedError(recordName: "RA1ParityRecord.collision"))
                  XCTAssertFalse(synchronizer.syncing)
                  XCTAssertFalse(synchronizer.synchronizationDrainIsActive)
                  XCTAssertNil(synchronizer.retrySleepUntil)
                  XCTAssertNil(synchronizer.synchronizationTask)
              }

              @BigSyncBackgroundActor
              func testUnrelatedTerminalFailureDoesNotBecomeReplay() async throws {
                  let (synchronizer, directory) = makeSynchronizer()
                  defer { try? FileManager.default.removeItem(at: directory) }
                  synchronizer.syncing = true
                  synchronizer.synchronizationDrainIsActive = true
                  await synchronizer.failSynchronization(error: ReplayProbeError.terminal)
                  XCTAssertFalse(synchronizer.syncing)
                  XCTAssertFalse(synchronizer.synchronizationDrainIsActive)
                  XCTAssertNil(synchronizer.retrySleepUntil)
                  XCTAssertNil(synchronizer.synchronizationTask)
              }
          }
          ''')
          PY
          git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+Sync.swift Tests/BigSyncKitTests/RA1InboundReplayTests.swift
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+Sync.swift Tests/BigSyncKitTests/RA1InboundReplayTests.swift "
      - name: Focused replay classification and cancellation
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          swift test --filter RA1InboundReplayTests 2>&1 | tee /tmp/ra1-focused.log
          grep -q 'Executed 4 tests, with 0 failures' /tmp/ra1-focused.log
      - name: Existing real adapter collision and replay
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          swift test --filter testNonJournaledTargetChangeRejectsOrdinaryAndForcedImportThenReplays 2>&1 | tee /tmp/ra1-adapter.log
          grep -q 'Executed 1 test, with 0 failures' /tmp/ra1-adapter.log
      - name: Full BigSyncKit suite
        working-directory: BigSyncKit
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        run: |
          set -euo pipefail
          swift test 2>&1 | tee /tmp/ra1-full.log
      - name: Publish clean source-only continuation
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 84571b4c2a5262dfa52b66772d0276485d150f20
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+Sync.swift Tests/BigSyncKitTests/RA1InboundReplayTests.swift "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replay inbound target races through fenced ordinary retry'
          git push origin HEAD:refs/heads/codex/ra1-final-inbound-replay-20260912
          git show --stat --oneline HEAD | tee /tmp/ra1-published.log
      - name: Preserve logs and exact source patch
        if: always()
        working-directory: BigSyncKit
        run: |
          mkdir -p /tmp/ra1-evidence
          cp /tmp/ra1-*.log /tmp/ra1-evidence/ 2>/dev/null || true
          git diff 84571b4c2a5262dfa52b66772d0276485d150f20 -- Sources Tests > /tmp/ra1-evidence/source.patch
          git status --porcelain=v1 > /tmp/ra1-evidence/status.txt
          git rev-parse HEAD > /tmp/ra1-evidence/source-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra1-inbound-replay-evidence
          path: /tmp/ra1-evidence
