name: RA1 selected public source inspection
on:
  push:
    branches: [codex/ra1-bigsync-inbound-replay-20260912]
    paths: [.github/workflows/ra1-inbound-replay.yml]
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 84571b4c2a5262dfa52b66772d0276485d150f20
          persist-credentials: false
      - name: Archive immutable public source without Git credentials or history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 84571b4c2a5262dfa52b66772d0276485d150f20
          mkdir -p /tmp/ra1-public-source
          git archive --format=tar.gz HEAD > /tmp/ra1-public-source/BigSyncKit-84571b4c.tar.gz
          git rev-parse HEAD > /tmp/ra1-public-source/source-head.txt
          sha256sum /tmp/ra1-public-source/BigSyncKit-84571b4c.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ra1-selected-public-bigsync-source
          path: /tmp/ra1-public-source
