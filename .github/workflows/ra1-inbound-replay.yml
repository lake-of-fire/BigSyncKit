name: RA-1 inbound replay diagnostic

on:
  push:
    branches:
      - codex/ra1-bigsync-inbound-replay-20260912

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Locate crash-recovery fixture and operation identity state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = ['testCrashRecoveryResendsTheSameLogicalGeneration', 'CrashRecoveryResends', 'SameLogicalGeneration', 'submittedOperationID', 'submittedOperation', 'operationID']
          for root in [Path('Sources'), Path('Tests')]:
              for f in root.rglob('*.swift'):
                  s = f.read_text(errors='replace')
                  hits = [n for n in needles if n in s]
                  if not hits:
                      continue
                  print(f'=== {f} hits={hits} ===')
                  lines = s.splitlines()
                  emitted=set()
                  for no,line in enumerate(lines,1):
                      if any(n in line for n in needles):
                          lo=max(1,no-20); hi=min(len(lines),no+40)
                          key=(lo,hi)
                          if key in emitted: continue
                          emitted.add(key)
                          for j in range(lo,hi+1): print(f'{j}: {lines[j-1]}')
                          print()
          PY
