name: RA-1 inbound replay diagnostic

on:
  push:
    branches:
      - codex/ra1-bigsync-inbound-replay-20260912

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Print crash-recovery fixture and submittedOperationID call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/BigSyncKitTests/BigSyncKitTests.swift')
          t = p.read_text()
          n = 'testCrashRecoveryResendsTheSameLogicalGeneration'
          i = t.find(n)
          print('TEST_INDEX', i)
          if i >= 0:
              print(t[max(0, i-3500):i+9000])
          print('\n=== submittedOperationID call sites ===')
          for root in [Path('Sources'), Path('Tests')]:
              for f in root.rglob('*.swift'):
                  s = f.read_text(errors='replace')
                  if 'submittedOperationID' in s:
                      print(f'--- {f} ---')
                      for no, line in enumerate(s.splitlines(), 1):
                          if 'submittedOperationID' in line:
                              lo=max(1,no-12); hi=min(len(s.splitlines()),no+16)
                              lines=s.splitlines()
                              for j in range(lo,hi+1): print(f'{j}: {lines[j-1]}')
                              print()
          PY
