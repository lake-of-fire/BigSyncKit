name: Apply reviewed hotfix grouping changes
on:
  push:
    branches: [fix/hotfix-realm-grouping-20260914]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hotfix-realm-grouping-20260914
      - name: Apply exact source changes and remove this temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          p = Path('Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift')
          data = p.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if actual != 'cfc60e69f7b9a0e7a345237f9094fa94757f5475':
              raise SystemExit('Reviewed source changed; refusing to patch')
          text = data.decode()
          pattern = r'(?m)^( +)if var group = generationsByRealm\[realmIdentity\] \{\n\1    group\.generations\[recordName\] = generation\n\1    generationsByRealm\[realmIdentity\] = group\n\1\} else \{\n\1    generationsByRealm\[realmIdentity\] = \(\n\1        targetReaderRealm,\n\1        \[recordName: generation\]\n\1    \)\n\1\}'
          def generations(match):
              i = match[1]
              return '\n'.join([i + 'generationsByRealm[', i + '    realmIdentity,', i + '    default: (realm: targetReaderRealm, generations: [:])', i + '].generations[recordName] = generation'])
          text, count = re.subn(pattern, generations, text)
          if count != 2:
              raise SystemExit(f'Expected two acknowledgement groups, found {count}')
          pattern = r'(?m)^( +)if var group = candidatesByRealm\[realmIdentity\] \{\n\1    group\.candidates\.append\(candidate\)\n\1    candidatesByRealm\[realmIdentity\] = group\n\1\} else \{\n\1    candidatesByRealm\[realmIdentity\] = \(\n\1        targetWriterRealm,\n\1        \[candidate\]\n\1    \)\n\1\}'
          def candidates(match):
              i = match[1]
              return '\n'.join([i + 'candidatesByRealm[', i + '    realmIdentity,', i + '    default: (realm: targetWriterRealm, candidates: [])', i + '].candidates.append(candidate)'])
          text, count = re.subn(pattern, candidates, text)
          if count != 1:
              raise SystemExit(f'Expected one inbound group, found {count}')
          p.write_text(text)
          Path('.github/workflows/apply-reviewed-grouping-20260914.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift .github/workflows/apply-reviewed-grouping-20260914.yml
          git commit -m 'Mutate per-Realm acknowledgement and inbound groups in place'
          git push origin HEAD:fix/hotfix-realm-grouping-20260914
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-grouping-source
          path: Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift
          retention-days: 1
