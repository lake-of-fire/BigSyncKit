name: Hotfix native qualification
on:
  push:
    branches: [fix/hotfix-sync-reevaluation-20260912]
    paths: [.github/workflows/hotfix-reevaluation.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: BigSyncKit
      - name: Apply hash-verified followup
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          source = pathlib.Path('.github/hotfix-boundary-followup.patch.zlib.b64')
          encoded = source.read_text().strip().replace('NxqTf6+0NxqTf6+0NBlv', 'NxqTf6+0NBlv')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7f78afe0343328a3b0ef170bbab7568828fed6b75cf950b0145471388d4bcc64'
          allowed = {
              'Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+Sync.swift',
              'Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift',
              'Tests/BigSyncKitTests/BigSyncKitTests.swift',
              'Tests/BigSyncKitTests/WorkerReviewReconciliationTests.swift',
          }
          path = pathlib.Path('/tmp/hotfix-followup.patch')
          path.write_bytes(patch)
          names = subprocess.check_output(['git', 'apply', '--numstat', str(path)]).decode().splitlines()
          assert {line.split('\t', 2)[2] for line in names} == allowed
          if subprocess.run(['git', 'apply', '--reverse', '--check', str(path)], capture_output=True).returncode != 0:
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD:Sources']).decode().strip() == '669359e2836d463b08db9de5c14e691cc9a1f5e3'
              subprocess.run(['git', 'apply', '--check', str(path)], check=True)
              subprocess.run(['git', 'apply', str(path)], check=True)
          source.write_text(encoded + '\n')
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(allowed), str(source)], check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reject stale download boundaries and qualify transport fixtures'
            git push origin HEAD:refs/heads/fix/hotfix-sync-reevaluation-20260912
          fi
          git rev-parse HEAD > qualification-commit.txt
          git rev-parse HEAD:Sources > qualification-source-tree.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Toolchain
        working-directory: BigSyncKit
        run: swift --version > qualification-toolchain.txt
      - name: Native boundary regressions
        id: focused
        continue-on-error: true
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          path = pathlib.Path('qualification-focused.log')
          with path.open('w') as output:
              try:
                  code = subprocess.run(['swift', 'test', '--filter', 'testReview|testReevaluation|testTerminalPublicationEvidenceRestoresOnlyForExactTransportBoundary'], stdout=output, stderr=subprocess.STDOUT, timeout=600).returncode
              except subprocess.TimeoutExpired:
                  output.write('\nQUALIFICATION_TIMEOUT: focused suite exceeded 600 seconds\n')
                  code = 124
          print(path.read_text()[-32000:])
          sys.exit(code)
          PY
      - name: Full suite including mutation benchmark
        id: full
        continue-on-error: true
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          path = pathlib.Path('qualification-full.log')
          with path.open('w') as output:
              try:
                  code = subprocess.run(['swift', 'test'], stdout=output, stderr=subprocess.STDOUT, timeout=600).returncode
              except subprocess.TimeoutExpired:
                  output.write('\nQUALIFICATION_TIMEOUT: full suite exceeded 600 seconds\n')
                  code = 124
          print(path.read_text()[-32000:])
          sys.exit(code)
          PY
      - name: Archive exact tested source
        if: always()
        working-directory: BigSyncKit
        run: |
          cp Package.resolved qualification-Package.resolved
          git archive --format=tar.gz -o qualification-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-native-qualification
          path: BigSyncKit/qualification-*
          retention-days: 7
      - name: Require every qualification stage
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
        run: test "$FOCUSED" = success && test "$FULL" = success
