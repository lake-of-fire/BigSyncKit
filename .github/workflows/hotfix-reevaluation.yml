name: Hotfix native qualification
on:
  push:
    branches: [fix/hotfix-sync-reevaluation-20260912]
    paths:
      - .github/workflows/hotfix-reevaluation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/hotfix-sync-reevaluation-20260912
          path: BigSyncKit
      - name: Correct checked restoration fixtures
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/BigSyncKitTests/BigSyncKitTests.swift')
          s = p.read_text()
          old = 'consumedServerBoundaryIdentifier: CloudKitSynchronizer.makeConsumedServerBoundaryIdentifier('
          new = 'consumedServerBoundaryIdentifier: try XCTUnwrap(CloudKitSynchronizer.makeConsumedServerBoundaryIdentifier('
          if old in s:
              assert s.count(old) == 2
              assert s.count('            ), runID: UUID(), publishedAt: Date()') == 2
              s = s.replace(old, new).replace('            ), runID: UUID(), publishedAt: Date()', '            )), runID: UUID(), publishedAt: Date()')
              p.write_text(s)
          PY
          git diff --check
          git add Tests/BigSyncKitTests/BigSyncKitTests.swift
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: unwrap restoration fixture boundary identifiers'
            git push origin HEAD:refs/heads/fix/hotfix-sync-reevaluation-20260912
          fi
          git rev-parse HEAD > qualification-commit.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Toolchain
        working-directory: BigSyncKit
        run: |
          xcodebuild -version | tee qualification-toolchain.txt
          swift --version | tee -a qualification-toolchain.txt
      - name: Native focused regressions
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          swift test --filter testReevaluation 2>&1 | tee qualification-focused.log
      - name: Full BigSyncKit suite
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee qualification-full.log
      - name: Archive exact tested source
        if: always()
        working-directory: BigSyncKit
        run: git archive --format=tar.gz -o qualification-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-native-qualification
          path: BigSyncKit/qualification-*
          retention-days: 7
