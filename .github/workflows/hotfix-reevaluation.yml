name: Hotfix native qualification
on:
  push:
    branches: [fix/hotfix-sync-reevaluation-20260912]
    paths: [.github/workflows/hotfix-reevaluation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Record inputs and diagnostic-only instrumentation
        working-directory: BigSyncKit
        run: |
          git rev-parse HEAD > qualification-commit.txt
          xcodebuild -version > qualification-toolchain.txt
          swift --version >> qualification-toolchain.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/BigSyncKit/QSSynchronizer/BigSyncDurablePublicationEvidence.swift')
          s = p.read_text()
          old = '                throw CancellationError()'
          assert s.count(old) == 1
          s = s.replace(old, '                print("RESTORATION_REJECTION", synchronizationAttemptID == expectedAttemptID, syncing, synchronizationDrainIsActive, backupRestoreDetected, accountScopeAuthorityFence.rejectsAuthority)\n' + old)
          p.write_text(s)
          p = Path('Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift')
          s = p.read_text()
          for label in ['matching', 'wrongBoundary', 'wrongEpoch', 'pendingChanges', 'wrongAccount', 'wrongZone', 'wrongBinding']:
              token = '        let ' + label + ' = try await reopened'
              assert token in s, label
              s = s.replace(token, '        print("RESTORATION_STAGE", "' + label + '")\n' + token)
          p.write_text(s)
          PY
          git diff > qualification-diagnostic-only.patch
      - name: Isolated restoration and complete suite
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          failed = False
          cases = [('isolated', ['swift', 'test', '--filter', 'testTerminalPublicationEvidenceRestoresOnlyForExactTransportBoundary']), ('full', ['swift', 'test'])]
          for name, args in cases:
              path = pathlib.Path('qualification-' + name + '.log')
              with path.open('w') as output:
                  try:
                      code = subprocess.run(args, stdout=output, stderr=subprocess.STDOUT, timeout=900).returncode
                  except subprocess.TimeoutExpired:
                      output.write('\nQUALIFICATION_TIMEOUT\n')
                      code = 124
              print(name, 'exit', code)
              print('\n'.join(line for line in path.read_text().splitlines() if any(x in line for x in ['RESTORATION_', 'error:', 'Executed ', 'failed'])))
              failed |= code != 0
          sys.exit(1 if failed else 0)
          PY
      - name: Archive input source
        if: always()
        working-directory: BigSyncKit
        run: git archive --format=tar.gz -o qualification-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-native-qualification
          path: BigSyncKit/qualification-*
          retention-days: 7
