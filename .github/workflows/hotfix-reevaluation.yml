name: Hotfix deeper native qualification
on:
  push:
    branches: [fix/hotfix-sync-deeper-20260912]
    paths: [.github/workflows/hotfix-reevaluation.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: BigSyncKit
      - name: Bind retained fixtures to the test actor
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/BigSyncKitTests/BigSyncKitTests.swift')
          s = p.read_text()
          for name in ['warmTarget', 'targetRealm']:
              old = 'let ' + name + ' = try autoreleasepool { try Realm(configuration: target) }'
              new = 'let ' + name + ' = try await Realm(configuration: target, actor: BigSyncBackgroundActor.shared)'
              if old in s:
                  assert s.count(old) == 1
                  s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git add Tests
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: use actor-bound retained Realm fixtures'
            git push origin HEAD:refs/heads/fix/hotfix-sync-deeper-20260912
          fi
          git rev-parse HEAD > qualification-commit.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Toolchain
        working-directory: BigSyncKit
        run: |
          xcodebuild -version > qualification-toolchain.txt
          swift --version >> qualification-toolchain.txt
      - name: Focused regressions and full suite
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          failed = False
          for name, args in [('focused', ['swift', 'test', '--filter', 'testReevaluation']), ('full', ['swift', 'test'])]:
              path = pathlib.Path('qualification-' + name + '.log')
              with path.open('w') as output:
                  try:
                      code = subprocess.run(args, stdout=output, stderr=subprocess.STDOUT, timeout=900).returncode
                  except subprocess.TimeoutExpired:
                      output.write('\nQUALIFICATION_TIMEOUT\n')
                      code = 124
              print(name, 'exit', code)
              print('\n'.join(line for line in path.read_text().splitlines() if re.search(r': error:|^error:|Executed | failed ', line)))
              failed |= code != 0
          sys.exit(1 if failed else 0)
          PY
      - name: Archive exact tested source
        if: always()
        working-directory: BigSyncKit
        run: git archive --format=tar.gz -o qualification-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-native-qualification
          path: BigSyncKit/qualification-*
          retention-days: 7
