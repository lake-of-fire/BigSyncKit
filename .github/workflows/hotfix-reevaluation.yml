name: Hotfix native qualification
on:
  push:
    branches: [fix/hotfix-sync-reevaluation-20260912]
    paths:
      - .github/workflows/hotfix-reevaluation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/hotfix-sync-reevaluation-20260912
          path: BigSyncKit
      - name: Apply verified native corrections
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(pathlib.Path('.github/hotfix-native-corrections.patch.zlib.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f47cb69355f18e64c59e6a3606e6023085e8777a2493b045b019138f044a26be'
          pathlib.Path('/tmp/corrections.patch').write_bytes(patch)
          if subprocess.run(['git', 'apply', '--reverse', '--check', '/tmp/corrections.patch'], capture_output=True).returncode != 0:
              subprocess.run(['git', 'apply', '--check', '/tmp/corrections.patch'], check=True)
              subprocess.run(['git', 'apply', '/tmp/corrections.patch'], check=True)
          PY
          git diff --check
          git add Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift Tests/BigSyncKitTests/BigSyncKitTests.swift
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: inspect fresh cold Realm views at the terminal cut'
            git push origin HEAD:refs/heads/fix/hotfix-sync-reevaluation-20260912
          fi
          git rev-parse HEAD > qualification-commit.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Toolchain
        working-directory: BigSyncKit
        run: |
          xcodebuild -version | tee qualification-toolchain.txt
          swift --version | tee -a qualification-toolchain.txt
      - name: Native focused regressions
        id: focused
        continue-on-error: true
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          swift test --filter testReevaluation 2>&1 | tee qualification-focused.log
      - name: Full BigSyncKit suite
        working-directory: BigSyncKit
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          path = pathlib.Path('qualification-full.log')
          with path.open('w') as output:
              try:
                  result = subprocess.run(['swift', 'test'], stdout=output, stderr=subprocess.STDOUT, timeout=600)
                  code = result.returncode
              except subprocess.TimeoutExpired:
                  output.write('\nQUALIFICATION_TIMEOUT: full suite exceeded 600 seconds\n')
                  code = 124
          print(path.read_text()[-24000:])
          sys.exit(code)
          PY
      - name: Require focused regressions
        if: always()
        env:
          OUTCOME: ${{ steps.focused.outcome }}
        run: test "$OUTCOME" = success
      - name: Archive exact tested source
        if: always()
        working-directory: BigSyncKit
        run: git archive --format=tar.gz -o qualification-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-native-qualification
          path: BigSyncKit/qualification-*
          retention-days: 7
