name: Publish and qualify record rebase increment
on:
  push:
    branches: [verify/sync-fake-timelines-20260915]
    paths: [.github/workflows/publish-record-rebase.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: input
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/record-rebase-accounting-20260916
          path: BigSyncKit
      - id: commit
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8ea301afb04428fbf3aafff5963b37d1f2d4df48
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = pathlib.Path('../input/.github/patches/record-rebase-implementation.patch.gz.b64').read_text().strip()
          encoded = encoded.replace('H4sIAAAAAAAC/9Vde3PbOJL/158', 'H4sIAAAAAAAC/9Vde3PbOJL/358').replace('eCUPd2DzyG9qqcsf5Bb8LoIz', 'eCUPd2DzyG9qqcsf5Bb8LoNoIz')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e612aee0d4b9afd41d3729320973895fad8bbf3382c13dd7bb2dcd2823684350'
          pathlib.Path('../implementation.patch').write_bytes(patch)
          PY
          git apply --check ../implementation.patch
          git apply --index ../implementation.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebase pending records against atomic target-Realm comparison evidence'
          git push origin HEAD:refs/heads/fix/record-rebase-accounting-20260916
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish.outputs.commit }}
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Qualify rebase regressions and full library
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          swift --version > "$RUNNER_TEMP/evidence/toolchain.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
          brew install xcsift
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncRecordRebaseTests 2>&1 | tee "$RUNNER_TEMP/evidence/focused.log" | xcsift
          grep -q 'Executed 12 tests' "$RUNNER_TEMP/evidence/focused.log"
          swift test --scratch-path "$RUNNER_TEMP/build" 2>&1 | tee "$RUNNER_TEMP/evidence/full.log" | xcsift
          git diff --exit-code
          cp Package.resolved "$RUNNER_TEMP/evidence/Package.resolved"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: record-rebase-green-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
