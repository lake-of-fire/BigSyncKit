name: Publish and qualify record rebase increment
on:
  push:
    branches: [verify/sync-fake-timelines-20260915]
    paths: [.github/workflows/publish-record-rebase.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: input
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/record-rebase-accounting-20260916
          path: BigSyncKit
      - id: commit
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5ddead37a6152b57df0a00306e0e4a31fe275960
          git apply --check ../input/.github/patches/record-rebase-import.patch
          git apply --index ../input/.github/patches/record-rebase-import.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import Realm collection primitives in the tests-first comparison baseline'
          git push origin HEAD:refs/heads/fix/record-rebase-accounting-20260916
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish.outputs.commit }}
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Confirm the before-fix behavioral failures
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          swift --version > "$RUNNER_TEMP/evidence/toolchain.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/identity.txt"
          brew install xcsift
          set +e
          swift test --scratch-path "$RUNNER_TEMP/build" --filter SyncRecordRebaseTests 2>&1 | tee "$RUNNER_TEMP/evidence/red.log" | xcsift
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -q 'Executed 12 tests' "$RUNNER_TEMP/evidence/red.log"
          grep -q 'REBASING:' "$RUNNER_TEMP/evidence/red.log"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: record-rebase-red-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
