name: Terminal observer native review
on:
  push:
    branches: [audit/terminal-review-20260910-b]
    paths: [.github/workflows/terminal-review-native-b.yml]
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1ff11190ce4dc21833a1d930000e75fad16e2229
          path: source/BigSyncKit
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 3c0ccf00d734cae997bd34654a4f2efd01397531
          path: source/RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: source/SwiftUtilities
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Native regression and source publication
        run: |
          set -euo pipefail
          mkdir evidence
          EVIDENCE="$PWD/evidence"
          python3 review/audit/terminal-review.py source/BigSyncKit tests
          cd source/BigSyncKit
          swift --version > "$EVIDENCE/swift.txt"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/before.txt"
          set +e
          swift test -j 4 --filter 'CloudKitTerminalReceiptTests.testTerminalSuccess' > "$EVIDENCE/baseline.log" 2>&1
          baseline=$?
          set -e
          echo "$baseline" > "$EVIDENCE/baseline-exit.txt"
          test "$baseline" -ne 0
          python3 - "$EVIDENCE/baseline.log" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          failed = re.findall(r"Test Case .*testTerminalSuccess.* failed \(", log)
          passed = re.findall(r"Test Case .*testTerminalSuccessUnchangedOwnerNotifiesExactlyOnce.* passed \(", log)
          assert len(failed) == 6 and len(passed) == 1, (len(failed), len(passed), log[-5000:])
          PY
          python3 ../../review/audit/terminal-review.py . runtime
          swift test -j 4 --filter CloudKitTerminalReceiptTests > "$EVIDENCE/terminal.log" 2>&1
          swift test -j 4 --filter 'CloudKitCursorPersistenceTests|CloudKitSynchronizerAccountFencingTests|AccountAuthorityPersistenceTests|ChangeFeedRecoveryStateTests|CloudKitAccountAvailabilityGateTests|BigSyncRecordIdentityBoundaryTests' > "$EVIDENCE/adjacent.log" 2>&1
          git diff --check
          git diff --binary > "$EVIDENCE/fix.patch"
          cp Package.resolved "$EVIDENCE/Package.resolved"
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+Sync.swift Tests/BigSyncKitTests/CloudKitTerminalReceiptTests.swift
          git commit -m 'Fence terminal success observers against synchronous run replacement'
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/after.txt"
          git ls-tree -r HEAD > "$EVIDENCE/source-manifest.txt"
          git archive --format=tar.gz HEAD > "$EVIDENCE/source.tar.gz"
          branch=codex/ordered-v2-followup-ownership-20260909
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = 1ff11190ce4dc21833a1d930000e75fad16e2229
          git push origin "HEAD:refs/heads/$branch"
          git ls-remote origin "refs/heads/$branch" > "$EVIDENCE/published.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-observer-review-evidence
          path: evidence
          retention-days: 30
