name: RA-1 W3 baseline contamination bisect
on:
  push:
    branches: [codex/ra1-final-w3-baseline-suite-20260912]
permissions:
  contents: read
concurrency:
  group: ra1-final-w3-baseline-suite
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  baseline:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/BigSyncKit
          ref: 84571b4c2a5262dfa52b66772d0276485d150f20
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Capture exact identity
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ra1-w3-bisect"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/ra1-w3-bisect/identity.txt"
          swift --version | tee "$RUNNER_TEMP/ra1-w3-bisect/toolchain.txt"
      - name: AccountAuthority then BigSyncKitTests
        continue-on-error: true
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          swift test --filter 'BigSyncKitTests\.(AccountAuthorityPersistenceTests|BigSyncKitTests)' 2>&1 | tee "$RUNNER_TEMP/ra1-w3-bisect/account-plus-bigsync.log"
      - name: BackupDetection then BigSyncKitTests
        if: always()
        continue-on-error: true
        working-directory: BigSyncKit
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        run: |
          set -o pipefail
          swift test --filter 'BigSyncKitTests\.(BackupDetectionTests|BigSyncKitTests)' 2>&1 | tee "$RUNNER_TEMP/ra1-w3-bisect/backup-plus-bigsync.log"
      - name: Account plus Backup plus BigSyncKitTests
        if: always()
        continue-on-error: true
        working-directory: BigSyncKit
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        run: |
          set -o pipefail
          swift test --filter 'BigSyncKitTests\.(AccountAuthorityPersistenceTests|BackupDetectionTests|BigSyncKitTests)' 2>&1 | tee "$RUNNER_TEMP/ra1-w3-bisect/account-backup-bigsync.log"
      - name: BigSyncKitTests then OwnedRevision
        if: always()
        continue-on-error: true
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          swift test --filter 'BigSyncKitTests\.(BigSyncKitTests|OwnedRecordRevisionTests)' 2>&1 | tee "$RUNNER_TEMP/ra1-w3-bisect/bigsync-plus-owned.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra1-final-w3-contamination-bisect
          path: ${{ runner.temp }}/ra1-w3-bisect/
          retention-days: 7
          if-no-files-found: error
