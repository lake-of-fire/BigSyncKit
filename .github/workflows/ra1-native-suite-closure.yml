name: RA1 native suite closure
on:
  push:
    branches: [codex/ra1-native-suite-closure-20260912]
    paths:
      - .github/workflows/ra1-native-suite-closure.yml
      - Scripts/ra1_native_suite_closure_patch.py
permissions:
  contents: write
jobs:
  native-suite:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b1cde24b2e22e68a5cd056b865bc53f7fd491e2a
          path: BigSyncKit
          persist-credentials: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Apply exact bounded patch and retain complete source
        working-directory: BigSyncKit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git rev-parse HEAD > ../evidence/source-base.txt
          git archive HEAD -o ../evidence/source-base.tar
          python3 ../tools/Scripts/ra1_native_suite_closure_patch.py
          git diff --check
          git diff --binary > ../evidence/source.patch
          shasum -a 256 ../evidence/source.patch > ../evidence/source-patch.sha256
          swift --version > ../evidence/toolchain.txt
          git -C ../RealmSwiftGaps rev-parse HEAD > ../evidence/realm-gaps-head.txt
          git -C ../SwiftUtilities rev-parse HEAD > ../evidence/swift-utilities-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ra1-suite-source
          path: evidence
      - name: Execute all tests without exclusions
        id: full
        working-directory: BigSyncKit
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        shell: bash
        run: |
          set -uo pipefail
          swift test 2>&1 | tee ../evidence/full.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../evidence/full-exit-code.txt
          exit "$status"
      - name: Verify fixture regression negative control and restore exact source
        if: always() && steps.full.outcome != 'skipped'
        working-directory: BigSyncKit
        env:
          BIGSYNC_RUN_MUTATION_BENCHMARK: '1'
        shell: bash
        run: |
          set -euo pipefail
          source_file=Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift
          cp "$source_file" ../evidence/synchronizer-restored.swift
          trap 'cp ../evidence/synchronizer-restored.swift "$source_file"' EXIT
          git show b1cde24b2e22e68a5cd056b865bc53f7fd491e2a:"$source_file" > "$source_file"
          set +e
          swift test --filter testReboundFixtureInitializesItsActualOutboundNamespace > ../evidence/negative-control.log 2>&1
          status=$?
          set -e
          echo "$status" > ../evidence/negative-control-exit-code.txt
          test "$status" -ne 0
          grep -q "testReboundFixtureInitializesItsActualOutboundNamespace.*failed" ../evidence/negative-control.log
          cp ../evidence/synchronizer-restored.swift "$source_file"
          swift test --filter testReboundFixtureInitializesItsActualOutboundNamespace > ../evidence/restored-focus.log 2>&1
          git diff --binary > ../evidence/restored.patch
          cmp ../evidence/source.patch ../evidence/restored.patch
      - name: Publish authenticated clean donor
        if: success()
        working-directory: BigSyncKit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --binary > ../evidence/publish.patch
          cmp ../evidence/source.patch ../evidence/publish.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+RecordMutations.swift \
            Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift \
            Tests/BigSyncKitTests/BigSyncKitTests.swift \
            Tests/BigSyncKitTests/OwnedRecordRevisionTests.swift
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m "Close RA-1 native suite mutation-drain fixtures"
          git push origin HEAD:refs/heads/codex/ra1-native-suite-donor-20260912
      - name: Summarize exact executed failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('evidence/full.log')
          text = p.read_text() if p.exists() else ''
          result = {'source_base': 'b1cde24b2e22e68a5cd056b865bc53f7fd491e2a', 'failed_cases': sorted(set(re.findall(r"Test Case '(.*?)' failed", text))), 'summaries': re.findall(r'Executed \\d+ tests?, with \\d+ failures?[^\\n]*', text)}
          Path('evidence/result.json').write_text(json.dumps(result, indent=2) + '\\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ra1-suite-closure-evidence
          path: evidence
