name: RA1 account authority port

on:
  push:
    branches:
      - scratch/ra1-account-authority-port-20260913

permissions:
  contents: write

jobs:
  port:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d5acf7f775ec09791185c969ce72f795536f898
          fetch-depth: 0
      - name: Compose final reviewed authority patch onto RA-1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          curl -L --fail --retry 3 https://github.com/lake-of-fire/BigSyncKit/pull/37.diff -o /tmp/pr37.diff

          set +e
          git apply --3way --index /tmp/pr37.diff
          apply_status=$?
          set -e
          test "$apply_status" -ne 0

          git checkout --ours -- Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift

          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift')
          source = source_path.read_text()
          conflict = re.compile(
              r'^<<<<<<< ours\n(.*?)^=======\n(.*?)^>>>>>>> theirs\n',
              re.MULTILINE | re.DOTALL,
          )
          seen = []

          def resolve(match):
              ours, theirs = match.group(1), match.group(2)

              if (
                  'publicationFetchDeferralHandler' in ours
                  and 'synchronizationCompletionHandler' in theirs
              ):
                  seen.append('properties')
                  return ours.rstrip('\n') + '\n' + '''    private var activeAccountValidationAuthority: (
                  attemptID: UUID,
                  fenceGeneration: UInt64
              )?
          '''

              if 'private func validateSynchronizationAccount() async throws -> String' in ours:
                  seen.append('validation-header')
                  return '''    private func validateSynchronizationAccount(
                  attemptID validationAttemptID: UUID,
                  fenceGeneration validationFenceGeneration: UInt64
              ) async throws -> String {
                  try checkAccountValidationAttempt(
                      validationAttemptID,
                      fenceGeneration: validationFenceGeneration
                  )
                  activeAccountValidationAuthority = (
                      validationAttemptID,
                      validationFenceGeneration
                  )
                  defer {
                      if activeAccountValidationAuthority?.attemptID
                              == validationAttemptID,
                         activeAccountValidationAuthority?.fenceGeneration
                              == validationFenceGeneration {
                          activeAccountValidationAuthority = nil
                      }
                  }
                  // RA-1 requires a durable/readable marker here; do not fall back
                  // to mainline's legacy best-effort defaults lookup.
                  let previousAccountIdentifier = try durableAccountIdentifier()
          '''

              if 'Activation may commit before the durable store reports failure.' in ours:
                  seen.append('port-activation')
                  return '''        // Fence this worker before the first fallible publication. RA-1
                  // deliberately keeps the restart fence even when a durable write
                  // reports an uncertain result; reconstruction must reload truth.
                  accountValidationRequired = true
                  cancelSync = true
                  portActivationRequiresWorkerRestart = true

                  try checkAccountValidationAttempt(
                      attemptID,
                      fenceGeneration: fenceGeneration
                  )
                  guard try accountScopeAuthorityFence
                      .withAuthorizedInvalidationGeneration(fenceGeneration, {
                          _ = try BigSyncReplicaBindingStateStore.activatePort(
                              expected,
                              store: keyValueStore,
                              key: replicaBindingStateKey
                          )
                          try persistAccountIdentifier(confirmedAccountIdentifier)
                          return true
                      }) == true else {
                      throw CancellationError()
                  }
          '''

              if (
                  'persistAccountIdentifier(confirmedAccountIdentifier)' in ours
                  and 'bigSyncSetDurably' in theirs
              ):
                  seen.append('account-publication')
                  return '''        try persistAccountIdentifier(confirmedAccountIdentifier)
                  try checkAccountValidationAttempt(
                      validationAttemptID,
                      fenceGeneration: validationFenceGeneration
                  )
          '''

              if (
                  'publicationConsumptionPending = false' in ours
                  and 'activeAccountValidationAuthority = nil' in theirs
              ):
                  seen.append('cancel')
                  return ours.rstrip('\n') + '\n        activeAccountValidationAuthority = nil\n'

              raise RuntimeError(
                  'Unexpected source conflict:\nOURS:\n' + ours[:1200]
                  + '\nTHEIRS:\n' + theirs[:1200]
              )

          source, count = conflict.subn(resolve, source)
          expected = {
              'properties', 'validation-header', 'account-publication',
              'port-activation', 'cancel'
          }
          if count != 5 or set(seen) != expected:
              raise RuntimeError(f'Expected five known conflicts, got {count}: {seen}')
          if any(marker in source for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise RuntimeError('Conflict markers remain in source')

          fence_start = source.index('final class AccountScopeAuthorityFence')
          fence_end = source.index('///  These keys will be added to CKRecords', fence_start)
          fence = source[fence_start:fence_end]
          if 'private var invalidationGeneration: UInt64 = 0' not in fence:
              needle = '    private var rotatesGeneration = false\n'
              if fence.count(needle) != 1:
                  raise RuntimeError('Cannot place authority invalidation generation')
              fence = fence.replace(
                  needle,
                  needle + '    private var invalidationGeneration: UInt64 = 0\n',
                  1,
              )
          if 'invalidationGeneration += 1' not in fence:
              needle = '''    func poison(requiresGenerationRotation: Bool = true) {
                  lock.lock()
                  isPoisoned = true
          '''
              replacement = '''    func poison(requiresGenerationRotation: Bool = true) {
                  lock.lock()
                  invalidationGeneration += 1
                  isPoisoned = true
          '''
              if fence.count(needle) != 1:
                  raise RuntimeError('Cannot fence poison with invalidation generation')
              fence = fence.replace(needle, replacement, 1)

          required_fence_symbols = [
              'var invalidationGenerationSnapshot: UInt64',
              'var authorizedInvalidationGenerationSnapshot: UInt64?',
              'func withAuthorizedInvalidationGeneration<T>',
              'func clear(ifInvalidationGenerationMatches expected: UInt64) -> Bool',
              'invalidationGeneration += 1',
          ]
          for symbol in required_fence_symbols:
              if symbol not in fence:
                  raise RuntimeError(f'Missing authority fence symbol: {symbol}')
          if 'publicationInspectionGeneration' in fence:
              raise RuntimeError('Unrelated mainline publication inspection state leaked into RA-1')

          source = source[:fence_start] + fence + source[fence_end:]
          if 'synchronizationCompletionHandler' in source:
              raise RuntimeError('Unrelated mainline completion machinery leaked into RA-1')
          source_path.write_text(source)

          test_path = Path('Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift')
          base_tests = test_path.read_text().rstrip() + '\n'
          diff = Path('/tmp/pr37.diff').read_text()
          marker = (
              'diff --git a/Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift '
              'b/Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift\n'
          )
          if diff.count(marker) != 1:
              raise RuntimeError('Could not isolate account-fencing test patch')
          chunk = diff.split(marker, 1)[1]
          if '\ndiff --git ' in chunk:
              chunk = chunk.split('\ndiff --git ', 1)[0]
          added = []
          for line in chunk.splitlines():
              if line.startswith('+++') or line.startswith('---') or line.startswith('@@'):
                  continue
              if line.startswith('-'):
                  raise RuntimeError('Final PR test patch is no longer append-only')
              if line.startswith('+'):
                  added.append(line[1:])
          appended = '\n'.join(added).rstrip() + '\n'
          required_tests = [
              'testAccountStatusPreflightCannotAdoptAuthorityPoisonedAfterCapture',
              'testInitialAdmissionRevalidationRejectsAuthorityGenerationChangeBeforeMutation',
              'testExplicitPortActivationRejectsAuthorityGenerationChangeAcrossAccountAwait',
              'testExplicitPortActivationCannotAdoptAlreadyPoisonedAuthority',
          ]
          for name in required_tests:
              if name not in appended:
                  raise RuntimeError(f'Missing focused regression {name}')
          test_path.write_text(base_tests + appended)
          PY

          git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift
          git add Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git diff --cached --name-only | grep -Fx 'Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift'
          git diff --cached --name-only | grep -Fx 'Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift'
          ! git diff --cached --name-only | grep -v -E '^(Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift|Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift)$'
      - name: Focused account authority qualification
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter CloudKitSynchronizerAccountFencingTests
          git diff --check
      - name: Commit bounded RA-1 continuation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: fence RA-1 account validation authority generation"
          git push origin HEAD:refs/heads/fix/ra1-account-validation-authority-20260913
