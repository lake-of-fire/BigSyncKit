name: RA1 account authority port

on:
  push:
    branches:
      - scratch/ra1-account-authority-port-20260913

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d5acf7f775ec09791185c969ce72f795536f898
          fetch-depth: 0
      - name: Diagnose final reviewed mainline patch composition
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          curl -L --fail --retry 3 https://github.com/lake-of-fire/BigSyncKit/pull/37.diff -o /tmp/pr37.diff
          set +e
          git apply --3way --index /tmp/pr37.diff
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '=== conflicted paths ==='
            git status --short
            echo '=== source conflicts ==='
            grep -n -B 18 -A 30 -E '^(<<<<<<<|=======|>>>>>>>)' Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift || true
            echo '=== test conflicts ==='
            grep -n -B 18 -A 30 -E '^(<<<<<<<|=======|>>>>>>>)' Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift || true
            exit 1
          fi
          git diff --cached --check
          git diff --cached --name-only
