name: Native CloudKit asset decoding
on:
  pull_request:
    branches: [main]
    paths:
      - Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift
      - Tests/BigSyncKitTests/HotfixCollectionSafetyTests.swift
      - .github/test-asset-decoding.sh
      - .github/workflows/asset-decoding.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asset-decoding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 1ffbedbb3d8dd90f44f651f618128e7806ce39dd
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Install compiler output formatter
        shell: bash
        run: brew install xcsift
      - name: Execute native collection and asset regressions
        shell: bash
        run: |
          export BIGSYNC_ASSET_EVIDENCE_DIRECTORY="$RUNNER_TEMP/asset-decoding-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /bin/bash "$PWD/BigSyncKit/.github/test-asset-decoding.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: asset-decoding-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asset-decoding-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
