name: Native sync release boundaries
on:
  pull_request:
    paths:
      - Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift
      - Tests/BigSyncKitTests/HotfixCollectionSafetyTests.swift
      - Tests/BigSyncKitTests/SyncRetainedRecordContractTests.swift
      - Tests/BigSyncKitTests/SyncSplitOperationOwnershipTests.swift
      - Tests/BigSyncKitTests/ChangeFeedMigrationResumeTests.swift
      - Tests/BigSyncKitTests/SyncPhaseAttemptOwnershipTests.swift
      - Tests/BigSyncKitTests/SyncUndoCloseoutW1Tests.swift
      - Tests/BigSyncKitTests/SyncUndoCloseoutW1UploadSnapshotTests.swift
      - Tests/BigSyncKitTests/BigSyncKitTests.swift
      - .github/test-asset-decoding.sh
      - .github/workflows/asset-decoding.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asset-decoding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 1ffbedbb3d8dd90f44f651f618128e7806ce39dd
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Install output parser
        run: brew install xcsift
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Record dependency identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C RealmSwiftGaps rev-parse HEAD > evidence/realm-gaps-commit.txt
          git -C SwiftUtilities rev-parse HEAD > evidence/swift-utilities-commit.txt
          test "$(cat evidence/realm-gaps-commit.txt)" = 1ffbedbb3d8dd90f44f651f618128e7806ce39dd
          test "$(cat evidence/swift-utilities-commit.txt)" = f437c7d06fc631cd7a67731279411c417cdf8077
      - name: Execute complete native release-boundary regressions
        shell: bash
        run: |
          export BIGSYNC_ASSET_EVIDENCE_DIRECTORY="$PWD/evidence"
          /bin/bash "$PWD/BigSyncKit/.github/test-asset-decoding.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-decoding-${{ github.run_attempt }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
