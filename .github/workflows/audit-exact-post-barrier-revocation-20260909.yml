name: Audit exact post barrier revocation
on:
  push:
    branches:
      - audit/push-immediate-account-fence-tests-20260909
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ordered-v2-followup-ownership-20260909
          fetch-depth: 0
      - name: Add exact post-barrier revocation API
        shell: bash
        run: |
          set -euo pipefail
          expected=369306381434fdea0c02743c57d05a2cd30dfdf7
          test "$(git rev-parse HEAD)" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift')
          s=p.read_text()
          anchor="        postBarrierDrainAuthorization = authorization\n        return authorization\n    }\n\n    /// Materializes an opaque completed-drain capability from the exact\n"
          insert="        postBarrierDrainAuthorization = authorization\n        return authorization\n    }\n\n    /// Revokes only the exact post-barrier authorization supplied by its holder.\n    /// An in-flight synchronization may continue as an ordinary drain, but it\n    /// can no longer mint a completed cutover capability. A matching completed\n    /// capability is invalidated too; ordinary receipts remain untouched.\n    @BigSyncBackgroundActor\n    @discardableResult\n    public func revokePostBarrierDrainAuthorization(\n        _ authorization: PostBarrierDrainAuthorization\n    ) -> Bool {\n        guard authorization.issuerID == synchronizationReceiptIssuerID else { return false }\n        var revoked = false\n        if postBarrierDrainAuthorization == authorization {\n            postBarrierDrainAuthorization = nil\n            revoked = true\n        }\n        if completedPostBarrierDrain?.postBarrierDrainAuthorizationID == authorization.authorizationID {\n            completedPostBarrierDrain = nil\n            revoked = true\n        }\n        return revoked\n    }\n\n    /// Materializes an opaque completed-drain capability from the exact\n"
          if s.count(anchor)!=1: raise SystemExit('authorization anchor mismatch')
          p.write_text(s.replace(anchor,insert,1))
          p=Path('Sources/BigSyncKit/QSSynchronizer/BigSyncBackgroundActor.swift')
          s=p.read_text()
          anchor="    @BigSyncBackgroundActor\n    public func completedPostBarrierDrain(\n"
          insert="    /// Revokes only a capability issued by the currently installed worker.\n    /// This does not cancel or await an ordinary synchronization run.\n    @BigSyncBackgroundActor\n    @discardableResult\n    public func revokePostBarrierDrainAuthorization(\n        _ authorization: CloudKitSynchronizer.PostBarrierDrainAuthorization\n    ) -> Bool {\n        guard let synchronizer = realmSynchronizer else { return false }\n        return synchronizer.revokePostBarrierDrainAuthorization(authorization)\n    }\n\n    @BigSyncBackgroundActor\n    public func completedPostBarrierDrain(\n"
          if s.count(anchor)!=1: raise SystemExit('worker anchor mismatch')
          p.write_text(s.replace(anchor,insert,1))
          PY
          git diff --check
          swiftc -frontend -parse Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift
          swiftc -frontend -parse Sources/BigSyncKit/QSSynchronizer/BigSyncBackgroundActor.swift
          git config user.name 'Alex Ehlke'
          git config user.email '71601+aehlke@users.noreply.github.com'
          git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift Sources/BigSyncKit/QSSynchronizer/BigSyncBackgroundActor.swift
          git commit -m 'Allow exact post-barrier authorization revocation'
          git push origin HEAD:codex/ordered-v2-followup-ownership-20260909
