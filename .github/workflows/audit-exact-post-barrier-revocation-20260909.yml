    /// Revokes only the exact post-barrier authorization supplied by its
    /// holder. An in-flight synchronization may continue as an ordinary drain,
    /// but it can no longer mint a completed cutover capability. If that exact
    /// drain already completed before the caller observed failure, invalidate
    /// the unconsumed completed capability as well. Ordinary receipts and
    /// publication evidence remain untouched.
    @BigSyncBackgroundActor
    @discardableResult
    public func revokePostBarrierDrainAuthorization(
        _ authorization: PostBarrierDrainAuthorization
    ) -> Bool {
        guard authorization.issuerID == synchronizationReceiptIssuerID else {
            return false
        }
        var revoked = false
        if postBarrierDrainAuthorization == authorization {
            postBarrierDrainAuthorization = nil
            revoked = true
        }
        if completedPostBarrierDrain?.postBarrierDrainAuthorizationID
            == authorization.authorizationID {
            completedPostBarrierDrain = nil
            revoked = true
        }
        return revoked
    }

