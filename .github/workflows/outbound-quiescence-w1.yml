name: Worker 1 outbound quiescence
on:
  push:
    branches: [audit/outbound-quiescence-20260910-w1]
    paths: [audit/quiescence-*, .github/workflows/outbound-quiescence-w1.yml]
permissions:
  contents: write
concurrency:
  group: worker1-outbound-quiescence
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 98619d90e771107c6a9ee5b27e7840b906eb887b
          path: source/BigSyncKit
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 3c0ccf00d734cae997bd34654a4f2efd01397531
          path: source/RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: source/SwiftUtilities
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Check exact patch and source tree
        run: |
          set -euo pipefail
          mkdir evidence
          python3 - <<'PY'
          import pathlib, base64, lzma, hashlib, subprocess
          encoded = ''.join(pathlib.Path(f'review/audit/quiescence-part-{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0df2d30f37ad35b3cbbbba6591d587080587bc36d674770c20da2e984a782d7e'
          path = pathlib.Path('evidence/fix.patch').resolve()
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], cwd='source/BigSyncKit', check=True)
          subprocess.run(['git', 'apply', str(path)], cwd='source/BigSyncKit', check=True)
          PY
          python3 review/audit/quiescence-refine.py source/BigSyncKit
          cd source/BigSyncKit
          git diff --check
          git add Documentation/OutboundQuiescence.md Sources/BigSyncKit/QSSynchronizer/BigSyncClientIdentity.swift Sources/BigSyncKit/QSSynchronizer/BigSyncOutboundQuiescence.swift Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+OutboundQuiescence.swift Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+RecordMutations.swift Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer+Sync.swift Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift Tests/BigSyncKitTests/BigSyncOutboundQuiescenceTests.swift Tests/BigSyncKitTests/CloudKitTerminalReceiptTests.swift
          test "$(git write-tree)" = e2fe9e9e9e81166711dd0fc56d18cece39cf3751
          git diff --cached --binary > ../../evidence/fix.patch
          git rev-parse HEAD > ../../evidence/before.txt
          git write-tree > ../../evidence/candidate-tree.txt
          swift --version > ../../evidence/swift.txt
      - name: Native isolated lease behavior tests
        run: |
          set -euo pipefail
          mkdir -p primitive/Sources/BigSyncKit primitive/Tests/BigSyncKitTests
          cp source/BigSyncKit/Sources/BigSyncKit/QSSynchronizer/{BigSyncOutboundQuiescence,KeyValueStore}.swift primitive/Sources/BigSyncKit/
          cp source/BigSyncKit/Tests/BigSyncKitTests/BigSyncOutboundQuiescenceTests.swift primitive/Tests/BigSyncKitTests/
          cat > primitive/Package.swift <<'SWIFT'
          // swift-tools-version: 5.11
          import PackageDescription
          let package = Package(name: "BigSyncKit", platforms: [.macOS("15.0")], targets: [.target(name: "BigSyncKit"), .testTarget(name: "BigSyncKitTests", dependencies: ["BigSyncKit"])])
          SWIFT
          cd primitive
          swift test -j 4 > ../evidence/primitive.log 2>&1 || { tail -150 ../evidence/primitive.log; exit 1; }
          tail -12 ../evidence/primitive.log
      - name: Native terminal and adjacent regression suites
        run: |
          set -euo pipefail
          cd source/BigSyncKit
          swift test -j 4 --filter 'CloudKitTerminalReceiptTests|BigSyncOutboundQuiescenceTests' > ../../evidence/terminal-and-quiescence.log 2>&1 || { tail -180 ../../evidence/terminal-and-quiescence.log; exit 1; }
          tail -12 ../../evidence/terminal-and-quiescence.log
          swift test -j 4 --filter 'CloudKitCursorPersistenceTests|CloudKitSynchronizerAccountFencingTests|AccountAuthorityPersistenceTests|ChangeFeedRecoveryStateTests|CloudKitAccountAvailabilityGateTests|BigSyncRecordIdentityBoundaryTests|BigSyncRecordConflictPolicyTests|ModelAdapterDeletionConflictSafetyTests' > ../../evidence/adjacent.log 2>&1 || { tail -180 ../../evidence/adjacent.log; exit 1; }
          tail -12 ../../evidence/adjacent.log
          swift test -j 4 --filter 'BigSyncKitTests.test(StrictJournalUploadAcknowledgesOnlyItsPreparedGeneration|BoundUploadAcknowledgesPreparedGenerationAndForwardsNewerEdit|UploadAcknowledgesOnlyTheGenerationThatWasPrepared|DeletionAcknowledgesOnlyTheGenerationThatWasPrepared|OpaquePreparedUploadBatchSupportsPartialAcknowledgement|OpaqueUploadBatchReplayDoesNotOverwriteNewerGeneration|SuspendedUploadPreparationCannotJoinANewerAttempt|AccountSwitchDuringUploadPreparationSkipsCloudKitMutation|MixedPartialUploadFailureDoesNotDiscardTheUnresolvedError|MixedDeletePartialFailureAcknowledgesOnlySuccessfulGeneration|CrossRecordSaveResultCannotRetireAnotherPendingGeneration|UploadSuccessRequiresTheRequestedZoneOwnerZoneNameAndType)' > ../../evidence/journal-boundaries.log 2>&1 || { tail -180 ../../evidence/journal-boundaries.log; exit 1; }
          tail -12 ../../evidence/journal-boundaries.log
      - name: Publish only reviewed source on normal PR history
        run: |
          set -euo pipefail
          cd source/BigSyncKit
          test "$(git write-tree)" = e2fe9e9e9e81166711dd0fc56d18cece39cf3751
          git diff --cached --check
          git config user.name 'Codex'
          git config user.email 'codex@users.noreply.github.com'
          git commit -m 'Fence cross-process outbound batches and retain reserved cutoff recovery'
          test "$(git rev-parse HEAD^)" = 98619d90e771107c6a9ee5b27e7840b906eb887b
          branch=codex/ordered-v2-followup-ownership-20260909
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = 98619d90e771107c6a9ee5b27e7840b906eb887b
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD HEAD^{tree} > ../../evidence/after.txt
          git ls-remote origin "refs/heads/$branch" > ../../evidence/published.txt
          git ls-tree -r HEAD > ../../evidence/source-manifest.txt
          git archive --format=tar.gz HEAD > ../../evidence/source.tar.gz
          cp Package.resolved ../../evidence/Package.resolved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker1-outbound-quiescence-evidence
          path: evidence
          retention-days: 30
