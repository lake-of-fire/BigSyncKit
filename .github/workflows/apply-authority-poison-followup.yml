name: Apply authority poison follow-up
on:
  push:
    branches: [fix/authority-poison-run-subscription-fence-20260913]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed source changes
        run: python3 .github/run-authority-poison-followup.py
      - name: Focused account and subscription qualification
        run: |
          swift test --filter CloudKitSynchronizerAccountFencingTests
          swift test --filter SubscriptionIntentOrderingTests
          swift test --filter HotfixSubscriptionSafetyTests
      - name: Full package suite
        run: swift test
      - name: Commit qualified source and remove temporary tooling
        run: |
          rm .github/apply-authority-poison-followup.py
          rm .github/run-authority-poison-followup.py
          rm .github/workflows/apply-authority-poison-followup.yml
          git add Sources Tests .github
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fence active-run and subscription authority poison'
          git push origin HEAD:fix/authority-poison-run-subscription-fence-20260913
