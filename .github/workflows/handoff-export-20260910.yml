name: Ordered V2 BigSync handoff export
on:
  push:
    branches: [audit/handoff-export-20260910]
    paths: [.github/workflows/handoff-export-20260910.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ordered-v2-followup-ownership-20260909
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact current PR8 source and patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/handoff/identity.txt"
          git log --oneline --decorate -20 > "$RUNNER_TEMP/handoff/recent-log.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/handoff/manifest.txt"
          git archive --format=tar HEAD | gzip -9 > "$RUNNER_TEMP/handoff/source.tar.gz"
          git format-patch --stdout 5574785f473a7d22536cc651918fa0ac7883bf4d..HEAD > "$RUNNER_TEMP/handoff/PR8-current.patch"
          git diff --binary --full-index 6dfefb4ad6a81bdce59d6bb979cf6537c418d536..HEAD > "$RUNNER_TEMP/handoff/from-6dfefb4-current.patch"
          sha256sum "$RUNNER_TEMP/handoff"/* > "$RUNNER_TEMP/handoff/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ordered-v2-current-bigsync-handoff
          path: ${{ runner.temp }}/handoff
          retention-days: 14
          if-no-files-found: error
