name: Export sync accounting review source
on:
  push:
    branches: [verify/sync-fake-timelines-20260915]
    paths: [.github/workflows/export-sync-accounting-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3bd36cc37b2c54f291476dbf296ed5de458e9608
          fetch-depth: 1
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source/tree.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sync-accounting-review-source
          path: ${{ runner.temp }}/source
          retention-days: 7
