name: Apply acknowledgement grouping optimization
on:
  push:
    branches: [perf/ack-grouping-in-place-20260914]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ack-grouping-in-place-20260914
      - name: Apply in-place grouping and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift')
          text = source.read_text()
          old = '''                if var group = generationsByRealm[realmIdentity] {
                              group.generations[recordName] = generation
                              generationsByRealm[realmIdentity] = group
                          } else {
                              generationsByRealm[realmIdentity] = (
                                  targetReaderRealm,
                                  [recordName: generation]
                              )
                          }
          '''
          new = '''                generationsByRealm[
                              realmIdentity,
                              default: (targetReaderRealm, [:])
                          ].generations[recordName] = generation
          '''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected upload and deletion grouping copies, found {count}')
          text = text.replace(old, new)
          source.write_text(text)

          tests = Path('Tests/BigSyncKitTests/HotfixMutationDrainTailTests.swift')
          test_text = tests.read_text()
          insertion = r'''

              @BigSyncBackgroundActor
              func testBulkUploadAndDeletionAcknowledgementsRetireAllMatchingGenerations() async throws {
                  let (adapter, realm) = try await fixture()
                  let count = 128

                  try await realm.asyncWrite {
                      for index in 0..<count {
                          let object = HotfixMutationDrainTailObject()
                          object.id = "bulk-\(index)"
                          object.payload = "value-\(index)"
                          realm.add(object)
                          object.refreshChangeMetadata(explicitlyModified: true)
                      }
                  }
                  try await adapter.didFinishImport()

                  let upload = try await adapter.prepareUploadBatch(limit: count + 1)
                  XCTAssertEqual(upload.records.count, count)
                  try await adapter.acknowledgeUploadedRecords(
                      upload.records,
                      from: upload
                  )
                  realm.refresh()
                  XCTAssertTrue(realm.objects(BigSyncPendingMutation.self).isEmpty)

                  try await realm.asyncWrite {
                      for object in realm.objects(HotfixMutationDrainTailObject.self) {
                          object.isDeleted = true
                          object.refreshChangeMetadata(explicitlyModified: true)
                      }
                  }
                  try await adapter.didFinishImport()

                  let deletion = try await adapter.prepareDeletionBatch(limit: count + 1)
                  XCTAssertEqual(deletion.recordIDs.count, count)
                  try await adapter.acknowledgeDeletedRecordIDs(
                      deletion.recordIDs,
                      from: deletion
                  )
                  realm.refresh()
                  XCTAssertTrue(realm.objects(BigSyncPendingMutation.self).isEmpty)
              }
          '''
          marker = '\n}\n'
          pos = test_text.rfind(marker)
          if pos == -1:
              raise SystemExit('test class closing brace not found')
          test_text = test_text[:pos] + insertion + test_text[pos:]
          tests.write_text(test_text)
          PY

          git rm .github/workflows/apply-ack-grouping-perf.yml
          git add Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift \
                  Tests/BigSyncKitTests/HotfixMutationDrainTailTests.swift
          git config user.name 'OpenAI Review Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Avoid acknowledgement grouping copy-on-write churn'
          git push origin HEAD:perf/ack-grouping-in-place-20260914
