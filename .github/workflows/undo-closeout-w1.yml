name: MR-UNDO-CLOSEOUT-20260920 W1 native qualification
on:
  push:
    branches: [codex/undo-closeout-w1-sync-20260920]
    paths:
      - .github/workflows/undo-closeout-w1.yml
      - Documentation/undo-closeout-20260920/session-1.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: undo-closeout-w1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Apply exact review candidate (temporary qualification checkpoint)
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          test "$(git hash-object Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift)" = d3ace2cd74f4068f18122c580b6fa09cde072d33
          git apply --check Documentation/undo-closeout-20260920/qualification/RealmSwiftAdapter.patch
          git apply Documentation/undo-closeout-20260920/qualification/RealmSwiftAdapter.patch
          test "$(git hash-object Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift)" = d10af4388f8e2990e8d631e3102c10f883514bbf
          git apply --check Documentation/undo-closeout-20260920/qualification/native-corrections.patch
          git apply Documentation/undo-closeout-20260920/qualification/native-corrections.patch
          test "$(git hash-object Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift)" = 480c4135a76d9b54d51adecdf8f6f6abd363b92c
          test "$(git hash-object Tests/BigSyncKitTests/SyncUndoCloseoutW1DisappearanceTests.swift)" = 72bbc542d32e08b345626f041002fd327338c1bd
          test "$(git hash-object Tests/BigSyncKitTests/SyncUndoCloseoutW1RepresentationTests.swift)" = 6e43979542b414c200fdedf65d281e9f3aac1ea5
      - name: Install structured build output
        run: brew install xcsift
      - name: Record exact source and toolchain
        working-directory: BigSyncKit
        run: |
          mkdir -p qualification-w1
          git rev-parse HEAD > qualification-w1/commit.txt
          git rev-parse HEAD:Sources > qualification-w1/input-source-tree.txt
          git hash-object Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift > qualification-w1/applied-adapter-blob.txt
          shasum -a 256 Documentation/undo-closeout-20260920/qualification/*.patch > qualification-w1/candidate-patches.sha256
          git diff --binary > qualification-w1/applied-candidate.patch
          tar -czf qualification-w1/applied-source.tar.gz Sources Tests Package.swift
          git -C ../RealmSwiftGaps rev-parse HEAD > qualification-w1/RealmSwiftGaps.txt
          git -C ../SwiftUtilities rev-parse HEAD > qualification-w1/SwiftUtilities.txt
          swift --version > qualification-w1/toolchain.txt
          sw_vers >> qualification-w1/toolchain.txt
          xcsift --version >> qualification-w1/toolchain.txt
          set -o pipefail
          xcodebuild -version 2>&1 | tee -a qualification-w1/toolchain.txt | xcsift -f json > qualification-w1/xcode-version.json
          git archive --format=tar.gz -o qualification-w1/source.tar.gz HEAD
      - name: Discover and execute native Realm tests
        working-directory: BigSyncKit
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
        run: |
          set -euo pipefail
          extra=()
          if swift test --help | grep -q -- '--disable-experimental-prebuilts'; then
            extra+=(--disable-experimental-prebuilts)
          fi
          swift test --scratch-path .build-w1 "${extra[@]}" list 2>&1 | tee qualification-w1/discovery.log | xcsift -f json --exit-on-failure
          grep -F 'SyncUndoCloseoutW1Tests/testOmittedScalarsApplyDeclaredDefaultsAndAgreeWithBaseline' qualification-w1/discovery.log
          grep -F 'SyncUndoCloseoutW1Tests/testTerminalLocalDeleteRetiresItsSupersededStagedSave' qualification-w1/discovery.log
          full_status=0
          swift test --scratch-path .build-w1 "${extra[@]}" --xunit-output qualification-w1/full.xml 2>&1 | tee qualification-w1/full.log | xcsift -f json --exit-on-failure || full_status=$?
          focused_status=0
          swift test --scratch-path .build-w1 "${extra[@]}" --skip-build --filter SyncUndoCloseoutW1 --xunit-output qualification-w1/focused.xml 2>&1 | tee qualification-w1/focused.log | xcsift -f json --exit-on-failure || focused_status=$?
          printf 'full=%s\nfocused=%s\n' "$full_status" "$focused_status" > qualification-w1/status.txt
          test "$full_status" -eq 0 && test "$focused_status" -eq 0
      - name: Diagnose native delete-restart crash
        if: failure()
        continue-on-error: true
        working-directory: BigSyncKit
        run: |
          set -o pipefail
          bundle="$(find "$PWD/.build-w1" -name BigSyncKitPackageTests.xctest -type d -print -quit)"
          test -n "$bundle"
          xcrun lldb --batch -o run -k 'thread backtrace all' -- "$(xcrun -f xctest)" -XCTest 'BigSyncKitTests.SyncUndoCloseoutW1Tests/testDeleteTargetFirstCrashFinishesTrackingWithoutAnotherServerDelete' "$bundle" 2>&1 | tee qualification-w1/delete-restart-backtrace.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: undo-closeout-w1-native
          path: BigSyncKit/qualification-w1
          retention-days: 14
