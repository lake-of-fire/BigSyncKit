name: MR-UNDO-CLOSEOUT-20260920 W1 native qualification
on:
  push:
    branches: [codex/undo-closeout-w1-sync-20260920, fix/incoming-operation-convergence-20261008]
    paths:
      - .github/workflows/undo-closeout-w1.yml
      - .github/verify_w1_execution.py
      - .github/test-undo-closeout-w1.sh
      - .github/tests/test_w1_execution.py
      - Documentation/undo-closeout-20260920/session-1.md
      - Sources/BigSyncKit/**
      - Tests/BigSyncKitTests/**
      - Package.swift
      - Package.resolved
  # Package PRs must not wait for a push to an obsolete qualification branch.
  # The task branch also has a direct push trigger; unrelated branches are unchanged.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/undo-closeout-w1.yml
      - .github/verify_w1_execution.py
      - .github/test-undo-closeout-w1.sh
      - .github/tests/test_w1_execution.py
      - Sources/BigSyncKit/**
      - Tests/BigSyncKitTests/**
      - Package.swift
      - Package.resolved
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: undo-closeout-w1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    # The owned task branch runs on push; keep other PRs and manual runs unchanged.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.head.ref != 'fix/incoming-operation-convergence-20261008'
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          # Match the Realm ownership helper selected by Reader PR #286.
          ref: 1ffbedbb3d8dd90f44f651f618128e7806ce39dd
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Verify native-result admission logic
        working-directory: BigSyncKit
        run: python3 -m unittest discover -s .github/tests -p 'test_w1_execution.py' -v
      - name: Install structured build output
        run: brew install xcsift
      - name: Record exact source and toolchain
        working-directory: BigSyncKit
        env:
          QUALIFICATION_EVENT: ${{ github.event_name }}
          QUALIFICATION_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir qualification-w1
          printf '%s\n' "$QUALIFICATION_EVENT" > qualification-w1/event.txt
          printf '%s\n' "$QUALIFICATION_PR_HEAD" > qualification-w1/pr-head.txt
          git rev-parse HEAD > qualification-w1/commit.txt
          git diff --exit-code
          git rev-parse HEAD:Sources > qualification-w1/source-tree.txt
          git rev-parse HEAD:Tests > qualification-w1/test-tree.txt
          git hash-object .github/verify_w1_execution.py > qualification-w1/verifier-blob.txt
          git hash-object Sources/BigSyncKit/RealmSwift/RealmSwiftAdapter.swift > qualification-w1/adapter-blob.txt
          git hash-object Tests/BigSyncKitTests/SyncUndoCloseoutW1DisappearanceTests.swift > qualification-w1/disappearance-tests-blob.txt
          git hash-object Tests/BigSyncKitTests/SyncUndoCloseoutW1RepresentationTests.swift > qualification-w1/representation-tests-blob.txt
          tar -czf qualification-w1/direct-source.tar.gz Sources Tests Package.swift
          git -C ../RealmSwiftGaps rev-parse HEAD > qualification-w1/RealmSwiftGaps.txt
          git -C ../SwiftUtilities rev-parse HEAD > qualification-w1/SwiftUtilities.txt
          swift --version > qualification-w1/toolchain.txt
          sw_vers >> qualification-w1/toolchain.txt
          xcode-select -p >> qualification-w1/toolchain.txt
          xcrun --show-sdk-version >> qualification-w1/toolchain.txt
          xcsift --version >> qualification-w1/toolchain.txt
          set +e
          xcodebuild -version 2>&1 | tee -a qualification-w1/toolchain.txt | xcsift -f json > qualification-w1/xcode-version.json
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '[%s, %s, %s]\n' "${statuses[0]}" "${statuses[1]}" "${statuses[2]}" > qualification-w1/xcode-version.status.json
          for status in "${statuses[@]}"; do test "$status" -eq 0; done
          git archive --format=tar.gz -o qualification-w1/source.tar.gz HEAD
      - name: Discover and execute native Realm tests
        working-directory: BigSyncKit
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
          BIGSYNC_RUN_MUTATION_BENCHMARK: "0"
        run: |
          set -euo pipefail
          export BIGSYNC_W1_EVIDENCE_DIRECTORY="$PWD/qualification-w1"
          export BIGSYNC_W1_SCRATCH_DIRECTORY="$RUNNER_TEMP/bigsync-w1-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          /bin/bash "$PWD/.github/test-undo-closeout-w1.sh"
      - name: Retain resolved graph even after a build failure
        if: always()
        working-directory: BigSyncKit
        run: |
          set -euo pipefail
          test -d qualification-w1 || exit 0
          for package in BigSyncKit RealmSwiftGaps SwiftUtilities; do
            if [ -f "../$package/Package.resolved" ]; then
              cp "../$package/Package.resolved" "qualification-w1/$package-Package.resolved"
            fi
          done
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: undo-closeout-w1-native
          path: BigSyncKit/qualification-w1
          retention-days: 14
