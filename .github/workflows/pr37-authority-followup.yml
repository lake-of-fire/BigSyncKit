name: PR37 account authority follow-up
on:
  push:
    branches:
      - fix/account-validation-generation-fence-20260913
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Apply reviewed authority follow-up
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/pr37_authority_followup.py')
          text = path.read_text()
          old = """source = replace_once(\n    source,\n    '''        activeRunContext = nil\\n        activeReceiptAuthorizationID = nil\\n        reservedReceiptAuthorizationID = nil\\n''',\n    '''        activeRunContext = nil\\n        activeAccountValidationAuthority = nil\\n        activeReceiptAuthorizationID = nil\\n        reservedReceiptAuthorizationID = nil\\n''',\n    'cancel clears validation authority'\n)"""
          new = """source = replace_once(\n    source,\n    '''        synchronizationAttemptID = UUID()\\n        cancelAttemptCallbacks(for: cancelledAttemptID)\\n        activeRunContext = nil\\n        activeReceiptAuthorizationID = nil\\n        reservedReceiptAuthorizationID = nil\\n''',\n    '''        synchronizationAttemptID = UUID()\\n        cancelAttemptCallbacks(for: cancelledAttemptID)\\n        activeRunContext = nil\\n        activeAccountValidationAuthority = nil\\n        activeReceiptAuthorizationID = nil\\n        reservedReceiptAuthorizationID = nil\\n''',\n    'cancel clears validation authority'\n)"""
          if text.count(old) != 1:
              raise SystemExit(f'cleanup script target count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 Scripts/pr37_authority_followup.py
          git diff --check
      - name: Run account fencing suite
        run: swift test --filter CloudKitSynchronizerAccountFencingTests
      - name: Commit qualified follow-up
        run: |
          rm .github/workflows/pr37-authority-followup.yml
          rm Scripts/pr37_authority_followup.py
          git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift .github/workflows/pr37-authority-followup.yml Scripts/pr37_authority_followup.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close account validation authority races"
          git push origin HEAD:${GITHUB_REF_NAME}
