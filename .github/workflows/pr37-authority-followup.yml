name: PR37 account authority follow-up
on:
  push:
    branches:
      - fix/account-validation-generation-fence-20260913
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Apply reviewed authority follow-up
        run: |
          python3 Scripts/pr37_authority_followup.py
          git diff --check
      - name: Run account fencing suite
        run: swift test --filter CloudKitSynchronizerAccountFencingTests
      - name: Commit qualified follow-up
        run: |
          rm .github/workflows/pr37-authority-followup.yml
          rm Scripts/pr37_authority_followup.py
          git add Sources/BigSyncKit/QSSynchronizer/CloudKitSynchronizer.swift Tests/BigSyncKitTests/CloudKitSynchronizerAccountFencingTests.swift .github/workflows/pr37-authority-followup.yml Scripts/pr37_authority_followup.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close account validation authority races"
          git push origin HEAD:${GITHUB_REF_NAME}
