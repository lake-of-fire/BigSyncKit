name: Hotfix findings union qualification
on:
  push:
    branches: [fix/hotfix-findings-union-20260912]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotfix-findings-union-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: BigSyncKit
      - name: Compose exact repair union and conflict-clock regression
        working-directory: BigSyncKit
        run: |
          python3 .github/compose_hotfix_findings_union.py | tee qualification-compose.txt
          git diff --exit-code
          git rev-parse HEAD > qualification-commit.txt
          git rev-parse HEAD:Sources > qualification-source-tree.txt
          git rev-parse HEAD:Tests > qualification-test-tree.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Record exact toolchain and dependencies
        working-directory: BigSyncKit
        run: |
          swift --version > qualification-toolchain.txt
          xcrun --show-sdk-version >> qualification-toolchain.txt
          git -C ../RealmSwiftGaps rev-parse HEAD > qualification-RealmSwiftGaps.txt
          git -C ../SwiftUtilities rev-parse HEAD > qualification-SwiftUtilities.txt
      - name: Native package qualification
        working-directory: BigSyncKit
        run: python3 .github/qualify_hotfix_closure.py
      - name: Archive exact qualified source
        if: always()
        working-directory: BigSyncKit
        run: |
          git archive --format=tar.gz -o qualification-source.tar.gz HEAD
          git log -1 --format=fuller > qualification-history.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-findings-union-native
          path: BigSyncKit/qualification-*
          retention-days: 14
