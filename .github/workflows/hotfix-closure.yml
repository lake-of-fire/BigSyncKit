name: Hotfix closure qualification
on:
  push:
    branches: [fix/hotfix-sync-closure-20260912]
    paths: [.github/workflows/hotfix-closure.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotfix-closure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: BigSyncKit
      - name: Apply bounded failure-flush repair once
        working-directory: BigSyncKit
        run: |
          if test -f .github/closure_failure_flush.py; then
            python3 .github/closure_failure_flush.py
            rm .github/closure_failure_flush.py
            git diff --check
            git add Sources Tests .github/closure_failure_flush.py .github/qualify_hotfix_closure.py
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: prevent failure cleanup forwarding before migration preparation completes'
            git push origin HEAD:refs/heads/fix/hotfix-sync-closure-20260912
          fi
          git diff --exit-code
          git rev-parse HEAD > qualification-commit.txt
          git rev-parse HEAD:Sources > qualification-source-tree.txt
          git rev-parse HEAD:Tests > qualification-test-tree.txt
          git log -1 --format=fuller > qualification-history.txt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 2d4fa2bfd8b1c856b45aca2c7a97c301d37204e2
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lake-of-fire/SwiftUtilities
          ref: f437c7d06fc631cd7a67731279411c417cdf8077
          path: SwiftUtilities
          persist-credentials: false
      - name: Native regressions, negative controls, full suite and repetition
        working-directory: BigSyncKit
        run: |
          swift --version > qualification-toolchain.txt
          xcrun --show-sdk-version >> qualification-toolchain.txt
          python3 .github/qualify_hotfix_closure.py
      - name: Archive exact candidate
        if: always()
        working-directory: BigSyncKit
        run: |
          git rev-parse HEAD > qualification-commit.txt
          git archive --format=tar.gz -o qualification-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hotfix-closure-native
          path: BigSyncKit/qualification-*
          retention-days: 14
