name: Worker 1 refined transport publish

on:
  push:
    branches:
      - codex/worker1-transport-publish-20260910

permissions:
  contents: write

concurrency:
  group: worker1-refined-transport-publish-pr8
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lake-of-fire/BigSyncKit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact payload and candidate
        shell: bash
        env:
          BASE: 98619d90e771107c6a9ee5b27e7840b906eb887b
          BASE_TREE: 567fa150a358412a7c480737721fac6766b3ff26
          EXPECTED_TREE: 966a76cf373ed9ebb671584eeaf027549cbef9ad
          TARGET_BRANCH: codex/ordered-v2-followup-ownership-20260909
          B64_SHA256: d255e6b2f7db9ccf3929045836ffb61113b0faf5dfd43a68b22cdfe5f1b6d4ff
          PATCH_SHA256: 2b007a97e9d1b4d1765b6ce21b101485da208cc26de94c49c5209ad73c3b3498
        run: |
          set -euo pipefail

          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          printf '%s  %s\n' \
            d0358da653b495534b1679f7a0099e52265d405929552237dcd1c4e431023311 .worker1-publish/chunks/00.part \
            d822a4b709f152e84a7cdb386afba6abfc2265c590bfbdce4defbdad9a62fdbb .worker1-publish/chunks/01.part \
            d092fc6da20ad6165c6520aacefa06a1855cec73b43569ae4f2a376670b27c68 .worker1-publish/chunks/02.part \
            43c10dae358304be6098c953a1eea7166897702fb91c33e4bdbc65afea7f4ed1 .worker1-publish/chunks/03.part \
            1bc0867984bbdf4c8d931f638e8c21361954ce394a80cfb93f4a6efa07323806 .worker1-publish/chunks/04.part \
            943a42663a1e2c5dfaeaae960ee04e9a5b11721ed5f0a913e1844fdfc56a5a04 .worker1-publish/chunks/05.part \
            | sha256sum -c -

          cat .worker1-publish/chunks/*.part > /tmp/refined.b64
          printf '%s  %s\n' "$B64_SHA256" /tmp/refined.b64 | sha256sum -c -
          base64 --decode /tmp/refined.b64 | gzip -dc > /tmp/refined.diff
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/refined.diff | sha256sum -c -

          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE"

          git checkout --detach "$BASE"
          git apply --check /tmp/refined.diff
          git apply /tmp/refined.diff
          git diff --check
          git add -A
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE"

          swift --version
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              swiftc -frontend -parse "$file"
            fi
          done < <(git diff --cached --name-only -- '*.swift')

          Tools/run-outbound-quiescence-portable-tests.sh
          Tools/run-outbound-quiescence-process-tests.sh

          export GIT_AUTHOR_NAME=Codex
          export GIT_AUTHOR_EMAIL=codex@users.noreply.github.com
          export GIT_COMMITTER_NAME=Codex
          export GIT_COMMITTER_EMAIL=codex@users.noreply.github.com
          commit="$(git commit-tree "$tree" -p "$BASE" <<'MSG'
          Fence cross-process outbound batches and bind final drains to durable cutoff ownership

          Hold ordinary uploads behind a process-shared durable cutoff, retain admission through acknowledgement, preserve unresolved submitted requests for explicit recovery, and bind final drains to the exact cutoff owner.

          Refine exact abort diagnostics so stale account/binding authority is distinguished from a genuinely busy synchronizer.
          MSG
          )"

          test "$(git rev-parse "$commit^")" = "$BASE"
          test "$(git rev-parse "$commit^{tree}")" = "$EXPECTED_TREE"
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE"
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          echo "PUBLISHED_COMMIT=$commit"
