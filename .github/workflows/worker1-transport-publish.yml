name: Worker 1 exact transport publish

on:
  push:
    branches:
      - codex/worker1-transport-publish-20260910

permissions:
  contents: write

concurrency:
  group: worker1-transport-publish-pr8
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lake-of-fire/BigSyncKit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, reconstruct exact candidate, and fast-forward PR 8
        shell: bash
        env:
          BASE: 98619d90e771107c6a9ee5b27e7840b906eb887b
          BASE_TREE: 567fa150a358412a7c480737721fac6766b3ff26
          EXPECTED_TREE: dc64d53cb8b3c729bd2fe9a2883bd6f930b1ed8c
          EXPECTED_COMMIT: 4efabfb2286466f32ff89e0a6367c32ced8f0446
          TARGET_BRANCH: codex/ordered-v2-followup-ownership-20260909
          PAYLOAD_SHA256: ea70a4b86cc69e9646e154009e8840fa2ef5bcbe79547a6df47e9b1b732c7ebf
          PATCH_SHA256: 8f25a4d57753776f68677c41596294eab87581d855129018eb146416b43588c0
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          printf '%s  %s\n' "$PAYLOAD_SHA256" .worker1-publish/patch.diff.gz.b64 | sha256sum -c -
          base64 --decode .worker1-publish/patch.diff.gz.b64 | gzip -dc > /tmp/worker1.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/worker1.patch | sha256sum -c -

          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE"

          git checkout --detach "$BASE"
          git apply --check /tmp/worker1.patch
          git apply /tmp/worker1.patch
          git diff --check
          git add -A
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE"

          export GIT_AUTHOR_NAME=Codex
          export GIT_AUTHOR_EMAIL=codex@users.noreply.github.com
          export GIT_AUTHOR_DATE='@1789035240 +0000'
          export GIT_COMMITTER_NAME=Codex
          export GIT_COMMITTER_EMAIL=codex@users.noreply.github.com
          export GIT_COMMITTER_DATE='@1789035240 +0000'
          commit="$(printf '%s\n' 'Fence cross-process outbound batches and bind final drains to durable cutoff ownership' | git commit-tree "$tree" -p "$BASE")"
          test "$commit" = "$EXPECTED_COMMIT"

          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE"
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
