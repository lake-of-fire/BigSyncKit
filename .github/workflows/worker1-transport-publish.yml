name: Worker 1 acknowledgement-lifetime refinement publish

on:
  push:
    branches:
      - codex/worker1-transport-publish-20260910

permissions:
  contents: write

concurrency:
  group: worker1-ack-lifetime-pr8
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lake-of-fire/BigSyncKit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify acknowledgement lifetime, test, and fast-forward PR 8
        shell: bash
        env:
          BASE: 98d75c4e478c8de626c30f08fb820b01e74e2bbb
          BASE_TREE: 69fdb89966778f3d691e4dc573b7ab30deb452c3
          TARGET_BRANCH: codex/ordered-v2-followup-ownership-20260909
          GZIP_SHA256: f7d1fce8559d10b4eb65b8d324ed712b9d01734d9f9dd4ce7416d26a7854bb98
          PATCH_SHA256: a9a1010634b0f2ef5c38706e135789b1e942f03af87067a5605bdf7c299dd201
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          printf '%s  %s\n' "$GZIP_SHA256" .worker1-publish/ack-lifetime.patch.gz | sha256sum -c -
          gzip -dc .worker1-publish/ack-lifetime.patch.gz > /tmp/refinement.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/refinement.patch | sha256sum -c -
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE"
          git checkout --detach "$BASE"
          git apply --check /tmp/refinement.patch
          git apply /tmp/refinement.patch
          git diff --check
          while IFS= read -r file; do
            if [[ -f "$file" && "$file" == *.swift ]]; then swiftc -frontend -parse "$file"; fi
          done < <(git diff --name-only)
          Tools/run-outbound-quiescence-portable-tests.sh
          Tools/run-outbound-quiescence-process-tests.sh
          git add -A
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME=Codex GIT_AUTHOR_EMAIL=codex@users.noreply.github.com
          export GIT_COMMITTER_NAME=Codex GIT_COMMITTER_EMAIL=codex@users.noreply.github.com
          commit="$(printf '%s\n\n%s\n' \
            'Retain outbound uncertainty through local acknowledgement' \
            'Do not clear a definitive CloudKit submission marker until generation-matched local response processing completes. Cancellation or authority replacement between server return and acknowledgement now remains fail-closed for explicit recovery.' \
            | git commit-tree "$tree" -p "$BASE")"
          test "$(git rev-parse "$commit^")" = "$BASE"
          current="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$current" = "$BASE"
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          echo "PUBLISHED_COMMIT=$commit"
          echo "PUBLISHED_TREE=$tree"
